function attachLoginEvents(){
  const showBtn = document.getElementById('show-password');
  if(showBtn){
    showBtn.addEventListener('click', ()=>{
      const passInp = document.getElementById('login-password');
      if(!passInp) return;
      const reveal = passInp.type === 'password';
      passInp.type = reveal ? 'text' : 'password';
      showBtn.setAttribute('aria-label', reveal ? 'Ocultar contraseña' : 'Mostrar contraseña');
    });
  }
  const forgot = document.getElementById('forgot-password');
  if(forgot){
    forgot.addEventListener('click', (e)=>{
      e.preventDefault();
      const msg = document.getElementById('login-message');
      if(msg){
        msg.style.color = '#E05A47';
        msg.textContent = 'En este prototipo local puedes iniciar sesión con cualquier correo y clave (mín. 6 letras).';
      }
    });
  }
  const form = document.getElementById('login-form');
  if(form){
    form.addEventListener('submit', (e)=>{
      e.preventDefault();
      const email = document.getElementById('login-email');
      const pass = document.getElementById('login-password');
      const msg = document.getElementById('login-message');
      if(!email || !email.value.trim()){
        if(msg){ msg.style.color = '#DC2626'; msg.textContent = 'Escribe tu correo electrónico.'; }
        email?.focus();
        return;
      }
      if(!pass || pass.value.length < 6){
        if(msg){ msg.style.color = '#DC2626'; msg.textContent = 'Introduce una clave de al menos 6 caracteres.'; }
        pass?.focus();
        return;
      }
      const remember = document.getElementById('remember-email');
      if(remember && remember.checked){
        try{ localStorage.setItem('trama_demo_email', email.value.trim()); }catch{}
      } else {
        try{ localStorage.removeItem('trama_demo_email'); }catch{}
      }
      loggedIn = true;
      try{ sessionStorage.setItem('trama_logged_in', 'true'); }catch{}
      render();
      notify('¡Bienvenido a TRAMA! Sesión iniciada.');
    });
  }
  // Visual pointer tilt on orbit in login
  const visual = document.getElementById('visual'), orbit = document.getElementById('orbit');
  if(visual && orbit && window.matchMedia && window.matchMedia('(hover:hover) and (pointer:fine)').matches){
    visual.addEventListener('pointermove', e => {
      const r = visual.getBoundingClientRect();
      const x = (e.clientX - r.left) / r.width - 0.5;
      const y = (e.clientY - r.top) / r.height - 0.5;
      orbit.style.transform = `perspective(700px) rotateY(${x * 6}deg) rotateX(${2 - y * 5}deg) translate(${x * 5}px,${y * 5}px)`;
    });
    visual.addEventListener('pointerleave', () => {
      orbit.style.transform = 'perspective(700px) rotateX(2deg)';
    });
  }
}

function updateTrack(){
  const nav = document.getElementById('sidebar-nav');
  const track = document.getElementById('nav-track');
  if(!nav || !track) return;
  const active = nav.querySelector('.nav-item.active');
  if(!active){ track.style.opacity = '0'; return; }
  track.style.transform = `translateY(${active.offsetTop}px)`;
  track.style.height = active.offsetHeight + 'px';
  track.style.opacity = '1';
}

function attachEnhanceEffects(){
  // 1. Add floating atmospheric orbs if not yet in DOM
  if(!document.querySelector('.fx-atmosphere')){
    const atmosphere = document.createElement('div');
    atmosphere.className = 'fx-atmosphere';
    atmosphere.setAttribute('aria-hidden', 'true');
    for (const name of ['one', 'two', 'three', 'four']) {
      const orb = document.createElement('i');
      orb.className = 'fx-orb ' + name;
      atmosphere.appendChild(orb);
    }
    document.body.appendChild(atmosphere);
  }

  // 2. Attach tilt classes to cards and panels
  const selector = '.kpi, .panel, .lot-card, .compact-row, .modal, .audit-balance';
  document.querySelectorAll(selector).forEach(el => {
    if(el.dataset.fxReady) return;
    el.dataset.fxReady = '1';
    el.classList.add('fx-tilt');
  });

  // 3. Update nav track position
  requestAnimationFrame(updateTrack);

  // 4. Attach sidebar toggle button listener
  const toggleBtn = document.getElementById('sidebar-toggle');
  const sidebar = document.getElementById('sidebar');
  if(toggleBtn && sidebar && !toggleBtn.dataset.bound){
    toggleBtn.dataset.bound = '1';
    toggleBtn.addEventListener('click', (e)=>{
      e.stopPropagation();
      sidebar.classList.toggle('collapsed');
      const isCollapsed = sidebar.classList.contains('collapsed');
      toggleBtn.setAttribute('aria-label', isCollapsed ? 'Expandir barra lateral' : 'Colapsar barra lateral');
      requestAnimationFrame(updateTrack);
    });
  }
}

function render(){
  const appEl = document.getElementById('app');
  if(!loggedIn){
    document.body.classList.remove('dashboard-active');
    appEl.innerHTML = renderLogin();
    attachLoginEvents();
  } else {
    document.body.classList.add('dashboard-active');
    appEl.innerHTML = renderShell();
    attachEnhanceEffects();
  }
}
function updateNewOrderSummary(){const form=document.getElementById('action-form');if(!form)return;if(modal&&modal.kind==='new-order'){const qtyInputs=[...form.querySelectorAll('.order-qty-input')];const totalUnits=qtyInputs.reduce((s,inp)=>s+(Number(inp.value)||0),0);const unitsEl=document.getElementById('order-summary-units');if(unitsEl)unitsEl.textContent=fmt(totalUnits)+' uds';const activeChks=[...form.querySelectorAll('.task-active-chk:checked')];let unitCost=0;for(const chk of activeChks){const idx=chk.value;const costInp=form.querySelector(`[name="task_cost_${idx}"]`);unitCost+=Number(costInp?.value||0);}const unitEl=document.getElementById('order-summary-unit-cost');if(unitEl)unitEl.textContent='$ '+fmt(unitCost);const totalCost=unitCost*totalUnits;const totalEl=document.getElementById('order-summary-total-cost');if(totalEl)totalEl.textContent='$ '+fmt(totalCost);}if(modal&&modal.kind==='process'){const good=Number(form.querySelector('[name="good"]')?.value||0);const l=getLot(modal.id),o=getOrder(l.orderId);const assign=(o?.assignments||[]).find(a=>a.area===modal.stage)||PLANT_CATALOG.find(a=>a.area===modal.stage);const rate=assign?.cost||0;const subEl=document.getElementById('process-subtotal');if(subEl)subEl.textContent='$ '+fmt(good*rate);}}

function handleSubmit(form){if(!modal)return;const m=modal,fd=new FormData(form);const get=(k)=>String(fd.get(k)||'');try{if(m.kind==='new-order'){requireRight(isManager());const sizes=[...form.querySelectorAll('[name="size"]')].map(e=>e.value),qs=[...form.querySelectorAll('[name="qty"]')].map(e=>e.value);const lines=sizes.map((size,i)=>({size,qty:qs[i]})).filter(l=>l.qty!==''&&Number(l.qty)>0);const activeChks=[...form.querySelectorAll('.task-active-chk:checked')];const assignments=activeChks.map(chk=>{const idx=Number(chk.value),cat=PLANT_CATALOG[idx];const worker=form.querySelector(`[name="task_worker_${idx}"]`)?.value||cat.worker;const cost=Number(form.querySelector(`[name="task_cost_${idx}"]`)?.value||cat.cost);return {area:cat.area,areaName:cat.areaName,task:cat.task,cost,worker,workers:[worker]};});view='orders';transact(()=>createOrder({reference:get('reference'),design:get('design'),customer:get('customer'),due:get('due'),notes:get('notes'),lines,assignments}));return;}if(m.kind==='process'){requireRight(authorized(m.stage));transact(()=>processLot(m.id,m.stage,get('good'),get('actor')));return;}if(m.kind==='add-user'){requireRight(hasAdmin());transact(()=>{const name=get('name').trim(),role=get('role');if(!name||name.length>70||!['admin','supervisor',...STAGES].includes(role))throw Error('Completa nombre y rol.');db.users.push({id:id('USR'),name,role});});return;}}catch(err){notify(err.message,true)}}

function validateBackup(raw){const x=JSON.parse(raw);if(!x||x.version!==1||!x.seq||!Array.isArray(x.users)||!x.users.length||!Array.isArray(x.orders)||!Array.isArray(x.lots)||!Array.isArray(x.transfers)||!Array.isArray(x.holds)||!Array.isArray(x.incidents)||!Array.isArray(x.events))throw Error('Respaldo incompatible o incompleto.');if(x.lots.length>100000||x.events.length>500000)throw Error('Archivo demasiado grande para este prototipo.');const lotSet=new Set(x.lots.map(l=>l.id));const ordSet=new Set(x.orders.map(o=>o.id));if(x.lots.some(l=>!ordSet.has(l.orderId))||x.transfers.some(t=>!lotSet.has(t.lotId))||x.holds.some(h=>!lotSet.has(h.lotId))||x.incidents.some(i=>!lotSet.has(i.lotId))||x.events.some(e=>!lotSet.has(e.lotId)))throw Error('Hay referencias internas inválidas.');verifyAll(x);return x;}
async function importBackup(file){if(!file)return;if(file.size>20*1024*1024){notify('El respaldo supera los 20 MB permitidos.',true);return}try{const d=validateBackup(await file.text());if(!confirm('¿Reemplazar todos los datos actuales con este respaldo? Descarga una copia de seguridad primero.'))return;db=d;if(!db.users.some(u=>u.id===db.currentUser))db.currentUser=db.users[0].id;orderChoice='';lotChoice='';modal=null;view='dashboard';save();render();notify('Respaldo restaurado.')}catch(err){notify('Importación rechazada: '+err.message,true)}}
document.addEventListener('click',e=>{if(e.target.id==='modal-overlay'){modal=null;render();return}const button=e.target.closest('[data-action],[data-nav],[data-stage]');if(!button||button.disabled)return;const action=button.dataset.action;try{if(action==='logout'){ loggedIn=false; try{ sessionStorage.removeItem('trama_logged_in'); }catch{} render(); notify('Sesión cerrada correctamente.'); return; }
if(button.dataset.nav){view=button.dataset.nav;modal=null;render();window.scrollTo({top:0,behavior:'instant'});return}if(button.dataset.stage){stageView=button.dataset.stage;render();return}if(action==='close-modal'){modal=null;render();return}if(action==='new-order'){requireRight(isManager());open('new-order');return}if(action==='order-detail'){orderChoice=button.dataset.id;render();document.querySelector('.content > section:last-child')?.scrollIntoView({behavior:'smooth',block:'nearest'});return}if(action==='close-order-detail'){orderChoice='';render();return}if(action==='process'){requireRight(authorized(button.dataset.stage));open('process',button.dataset.id,button.dataset.stage);return}if(action==='trace-lot'){lotChoice=button.dataset.id;view='work';stageView='trazabilidad';render();window.scrollTo({top:0,behavior:'instant'});return}if(action==='goto-trace'){view='work';stageView='trazabilidad';render();window.scrollTo({top:0,behavior:'instant'});return}if(action==='prev-week'){weekOffset--;render();return}if(action==='next-week'){if(weekOffset<0){weekOffset++;render();}return}if(action==='current-week'){weekOffset=0;render();return}if(action==='close-week'){transact(()=>closeWeek(button.dataset.week));return}if(action==='reopen-week'){transact(()=>reopenWeek(button.dataset.week));return}if(action==='print-payroll'){window.print();return}if(action==='export-payroll'){const range=getWeekRange(weekOffset),data=getPayItemsForWeek(range);exportPayrollCSV(range,data);return}if(action==='add-user'){requireRight(hasAdmin());open('add-user');return}if(action==='add-size'){let box=document.getElementById('size-rows');const row=document.createElement('div');row.className='size-row';row.innerHTML='<input name="size" placeholder="Talla" aria-label="Talla" required/><input type="number" name="qty" min="0" step="1" value="0" class="order-qty-input" aria-label="Cantidad" required/><button class="btn secondary sm" type="button" data-action="remove-size" title="Eliminar talla">×</button>';box.appendChild(row);row.querySelector('input').focus();updateNewOrderSummary();return}if(action==='remove-size'){const items=document.querySelectorAll('#size-rows .size-row');if(items.length===1){notify('Debe quedar al menos una fila de talla.',true);return}button.closest('.size-row')?.remove();updateNewOrderSummary();return}if(action==='export-json'){download('TRAMA_Respaldo_'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify(db,null,2));notify('Respaldo descargado.');return}if(action==='import-json'){requireRight(hasAdmin());document.getElementById('backup-file').click();return}if(action==='export-csv'){exportCSV();return}if(action==='reset-demo'){requireRight(hasAdmin());if(confirm('¿Restablecer la demostración? Se perderán los cambios que no hayas exportado.')){createDemo();save();render();notify('Demostración restablecida.');}return}if(action==='reset-empty'){requireRight(hasAdmin());if(confirm('¿Vaciar TODAS las órdenes y registros de producción? Se perderán los cambios no respaldados.')){db=defaultDB();db.demo=false;save();view='dashboard';lotChoice='';orderChoice='';render();notify('Entorno limpio creado.');}return}}catch(err){notify(err.message,true)}});
document.addEventListener('input',e=>{if(e.target.closest('#modal-overlay'))updateNewOrderSummary();});
document.addEventListener('change',e=>{if(e.target.closest('#modal-overlay'))updateNewOrderSummary();if(e.target.id==='active-user'){db.currentUser=e.target.value;save();render();notify('Usuario de prueba: '+current().name)}if(e.target.id==='lot-choice'){lotChoice=e.target.value;render()}if(e.target.id==='backup-file')importBackup(e.target.files?.[0]);});
document.addEventListener('submit',e=>{if(e.target.id==='action-form'){e.preventDefault();handleSubmit(e.target)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modal){modal=null;render()}});

// 3D Pointer Tilt Engine
document.addEventListener('pointermove', e => {
  if(!loggedIn) return;
  const el = e.target.closest('.fx-tilt');
  if (!el) return;
  const r = el.getBoundingClientRect();
  const x = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width));
  const y = Math.max(0, Math.min(1, (e.clientY - r.top) / r.height));
  el.style.setProperty('--fx-px', (x * 100) + '%');
  el.style.setProperty('--fx-py', (y * 100) + '%');
  el.style.setProperty('--fx-ry', ((x - 0.5) * 8).toFixed(2) + 'deg');
  el.style.setProperty('--fx-rx', ((0.5 - y) * 6).toFixed(2) + 'deg');
}, { passive: true });

document.addEventListener('pointerout', e => {
  const el = e.target.closest('.fx-tilt');
  if (el && (!e.relatedTarget || !el.contains(e.relatedTarget))) {
    el.style.setProperty('--fx-rx', '0deg');
    el.style.setProperty('--fx-ry', '0deg');
    el.style.setProperty('--fx-px', '50%');
    el.style.setProperty('--fx-py', '50%');
  }
}, { passive: true });

// Fluid Ripple Effect Engine
document.addEventListener('click', e => {
  const b = e.target.closest('.btn, .submit-btn, .nav-item, .stage-tab, .sidebar-logout, .sidebar-collapse-toggle');
  if (!b) return;
  const r = b.getBoundingClientRect();
  if (!r.width) return;
  const ripple = document.createElement('span');
  ripple.className = 'fx-ripple';
  ripple.style.setProperty('--x', (e.clientX - r.left) + 'px');
  ripple.style.setProperty('--y', (e.clientY - r.top) + 'px');
  b.appendChild(ripple);
  ripple.addEventListener('animationend', () => ripple.remove(), { once: true });
  setTimeout(() => ripple.remove(), 700);
  if (b.closest('.nav')) requestAnimationFrame(updateTrack);
}, true);

// Ctrl+B shortcut for sidebar collapse
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && (e.key === 'b' || e.key === 'B')) {
    e.preventDefault();
    const sidebar = document.getElementById('sidebar');
    if (sidebar) {
      sidebar.classList.toggle('collapsed');
      requestAnimationFrame(updateTrack);
    }
  }
});

init();
</script>
