color:#0e7c72">Mano de obra / prenda</div><div style="font-size:19px;font-weight:850;color:#07625a;letter-spacing:-.03em" id="order-summary-unit-cost">$ 13.100</div></div><div style="text-align:right"><div class="tiny-muted" style="text-transform:uppercase;letter-spacing:.05em;font-size:10px;font-weight:800;color:#0e7c72">Presupuesto total M.O.</div><div style="font-size:19px;font-weight:850;color:#07625a;letter-spacing:-.03em" id="order-summary-total-cost">$ 0</div></div></div></fieldset><div class="field" style="margin-top:14px"><label class="label" for="f-notes">Observaciones de producción</label><textarea name="notes" id="f-notes" rows="2" placeholder="Indicaciones de trazo, telas, insumos o particularidades"></textarea></div>`};
case 'process':{const l=getLot(m.id),b=l.stocks[m.stage],o=getOrder(l.orderId);const assign=(o?.assignments||[]).find(a=>a.area===m.stage)||PLANT_CATALOG.find(a=>a.area===m.stage);const next=nextAssignedStage(o,m.stage);const currentWorker=assign?.worker||current().name;const unitRate=assign?.cost||0;const st=lotStatusSummary(l);return {title:'Registrar avance · '+LABELS[m.stage],sub:l.code+' · '+lotDetail(l),button:'Confirmar avance del lote',body:`${renderLotStatusBoard(l,true)}<div class="inline-details" style="margin-top:12px"><span>Disponibles en estación: <b id="process-available">${fmt(b.pending)} uds</b></span><span>Siguiente destino: <b>${next?LABELS[next]:'Producto terminado'}</b></span><span>Tarifa destajo: <b>$ ${fmt(unitRate)} / ud buena</b></span></div><div class="form-grid process-advance-grid"><div class="field"><label class="label" for="f-good">Buenas (avanzan)</label><input id="f-good" name="good" type="number" min="0" max="${b.pending}" step="1" value="${b.pending}" class="process-qty-input" required /></div><div class="field"><label class="label" for="f-scrap">Dañadas / merma</label><input id="f-scrap" name="scrap" type="number" min="0" max="${b.pending}" step="1" value="0" class="process-qty-input" /></div><div class="field"><label class="label" for="f-hold">A retención</label><input id="f-hold" name="hold" type="number" min="0" max="${b.pending}" step="1" value="0" class="process-qty-input" /></div><div class="field"><label class="label" for="f-actor">Operario que registra</label><input id="f-actor" name="actor" type="text" value="${esc(currentWorker)}" required /></div><div class="field"><label class="label" for="f-scrapReason">Motivo de daño</label><select id="f-scrapReason" name="scrapReason">${SCRAP_REASONS.map(r=>`<option value="${esc(r)}">${esc(r)}</option>`).join('')}</select></div><div class="field"><label class="label" for="f-holdReason">Motivo de retención</label><input id="f-holdReason" name="holdReason" type="text" value="Revisión de calidad" maxlength="120" /></div></div><div class="process-balance-bar"><span>Suma del registro: <b id="process-sum">${fmt(b.pending)}</b> / ${fmt(b.pending)}</span><span id="process-balance-msg" class="tiny-muted">Listo para confirmar</span></div><div style="background:#f1f8f7;border:1px solid #cce8e2;border-radius:10px;padding:12px 14px;margin-top:12px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><div><div class="tiny-muted" style="text-transform:uppercase;font-size:10px;font-weight:800;color:#0e7c72">Destajo solo por unidades buenas</div><div style="font-size:19px;font-weight:850;color:#07625a" id="process-subtotal">$ ${fmt(b.pending * unitRate)}</div></div><span class="tiny-muted">Estado lote: ${fmt(st.finished)} term. · ${fmt(st.pending)} pend. · ${fmt(st.held)} ret. · ${fmt(st.scrap)} merma</span></div><div class="note">Las <b>buenas</b> avanzan a la siguiente área. Las <b>dañadas</b> salen a merma. Las de <b>retención</b> quedan en calidad para liberar o confirmar merma después.</div>`};}

function attachLoginEvents(){
  const showBtn = document.getElementById('show-password');
  if(showBtn){
    showBtn.addEventListener('click', ()=>{
      const passInp = document.getElementById('login-password');
      if(!passInp) return;
      const reveal = passInp.type === 'password';
      passInp.type = reveal ? 'text' : 'password';
      showBtn.setAttribute('aria-label', reveal ? 'Ocultar contraseña' : 'Mostrar contraseña');
    });
  }
  const forgot = document.getElementById('forgot-password');
  if(forgot){
    forgot.addEventListener('click', (e)=>{
      e.preventDefault();
      const msg = document.getElementById('login-message');
      if(msg){
        msg.style.color = '#E05A47';
        msg.textContent = 'Demo: admin@pimienta.com / demo1234. Usa camila@, julian@, laura@… para cargar el rol simulado.';
      }
    });
  }
  const form = document.getElementById('login-form');
  if(form){
    form.addEventListener('submit', (e)=>{
      e.preventDefault();
      const email = document.getElementById('login-email');
      const pass = document.getElementById('login-password');
      const msg = document.getElementById('login-message');
      if(!email || !email.value.trim()){
        if(msg){ msg.style.color = '#DC2626'; msg.textContent = 'Escribe tu correo electrónico.'; }
        email?.focus();
        return;
      }
      if(!pass || pass.value.length < 6){
        if(msg){ msg.style.color = '#DC2626'; msg.textContent = 'Introduce una clave de al menos 6 caracteres.'; }
        pass?.focus();
        return;
      }
      const remember = document.getElementById('remember-email');
      if(remember && remember.checked){
        try{ localStorage.setItem('trama_demo_email', email.value.trim()); }catch{}
      } else {
        try{ localStorage.removeItem('trama_demo_email'); }catch{}
      }
      db.currentUser = mapEmailToUser(email.value);
      save();
      loggedIn = true;
      try{ sessionStorage.setItem('trama_logged_in', 'true'); }catch{}
      render();
      notify('Demo iniciada como '+current().name+' ('+roleText(current().role)+').');
    });
  }
  // Visual pointer tilt on orbit in login
  const visual = document.getElementById('visual'), orbit = document.getElementById('orbit');
  if(visual && orbit && window.matchMedia && window.matchMedia('(hover:hover) and (pointer:fine)').matches){
    visual.addEventListener('pointermove', e => {
      const r = visual.getBoundingClientRect();
      const x = (e.clientX - r.left) / r.width - 0.5;
      const y = (e.clientY - r.top) / r.height - 0.5;
      orbit.style.transform = `perspective(700px) rotateY(${x * 6}deg) rotateX(${2 - y * 5}deg) translate(${x * 5}px,${y * 5}px)`;
    });
    visual.addEventListener('pointerleave', () => {
      orbit.style.transform = 'perspective(700px) rotateX(2deg)';
    });
  }
}

function updateTrack(){
  const nav = document.getElementById('sidebar-nav');
  const track = document.getElementById('nav-track');
  if(!nav || !track) return;
  const active = nav.querySelector('.nav-item.active');
  if(!active){ track.style.opacity = '0'; return; }
  track.style.transform = `translateY(${active.offsetTop}px)`;
  track.style.height = active.offsetHeight + 'px';
  track.style.opacity = '1';
}

function scheduleLayoutRefresh(){
  requestAnimationFrame(()=>{
    updateTrack();
    requestAnimationFrame(updateTrack);
  });
}

function attachEnhanceEffects(){
  // 1. Add floating atmospheric orbs if not yet in DOM
  if(!document.querySelector('.fx-atmosphere')){
    const atmosphere = document.createElement('div');
    atmosphere.className = 'fx-atmosphere';
    atmosphere.setAttribute('aria-hidden', 'true');
    for (const name of ['one', 'two', 'three', 'four']) {
      const orb = document.createElement('i');
      orb.className = 'fx-orb ' + name;
      atmosphere.appendChild(orb);
    }
    document.body.appendChild(atmosphere);
  }

  // 2. Update nav track position
  scheduleLayoutRefresh();

  // 3. Attach sidebar toggle button listener
  const toggleBtn = document.getElementById('sidebar-toggle');
  const sidebar = document.getElementById('sidebar');
  if(toggleBtn && sidebar && !toggleBtn.dataset.bound){
    toggleBtn.dataset.bound = '1';
    toggleBtn.addEventListener('click', (e)=>{
      e.stopPropagation();
      sidebar.classList.toggle('collapsed');
      const isCollapsed = sidebar.classList.contains('collapsed');
      try{ sessionStorage.setItem('trama_sidebar_collapsed', isCollapsed ? '1' : '0'); }catch{}
      toggleBtn.setAttribute('aria-label', isCollapsed ? 'Expandir panel' : 'Contraer panel');
      toggleBtn.title = isCollapsed ? 'Expandir panel (Ctrl+B)' : 'Contraer panel (Ctrl+B)';
      scheduleLayoutRefresh();
    });
  }
  if(sidebar && !sidebar.dataset.layoutBound){
    sidebar.dataset.layoutBound = '1';
    sidebar.addEventListener('transitionend', (e)=>{
      if(e.target !== sidebar) return;
      if(['width','flex-basis','max-width'].includes(e.propertyName)) scheduleLayoutRefresh();
    });
  }
}

function labelResponsiveTables(){
  document.querySelectorAll('table.data-table').forEach(table=>{
    const heads=[...table.querySelectorAll('thead th')].map(th=>th.textContent.replace(/\s+/g,' ').trim());
    table.querySelectorAll('tbody tr').forEach(tr=>{
      const cells=[...tr.children];
      if(cells.length===1 && cells[0].hasAttribute('colspan')) return;
      cells.forEach((td,i)=>{ if(heads[i]) td.dataset.label=heads[i]; });
    });
  });
}

}

  const r = b.getBoundingClientRect();
  if (!r.width) return;
  const ripple = document.createElement('span');
  ripple.className = 'fx-ripple';
  ripple.style.setProperty('--x', (e.clientX - r.left) + 'px');
  ripple.style.setProperty('--y', (e.clientY - r.top) + 'px');
  b.appendChild(ripple);
  ripple.addEventListener('animationend', () => ripple.remove(), { once: true });
  setTimeout(() => ripple.remove(), 700);
  if (b.closest('.nav')) requestAnimationFrame(updateTrack);
}, true);

// Ctrl+B shortcut for capsule collapse
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && (e.key === 'b' || e.key === 'B')) {
    e.preventDefault();
    const sidebar = document.getElementById('sidebar');
    if (sidebar) {
      sidebar.classList.toggle('collapsed');
      const isCollapsed = sidebar.classList.contains('collapsed');
      try{ sessionStorage.setItem('trama_sidebar_collapsed', isCollapsed ? '1' : '0'); }catch{}
      const toggleBtn = document.getElementById('sidebar-toggle');
      if (toggleBtn) {
        toggleBtn.setAttribute('aria-label', isCollapsed ? 'Expandir panel' : 'Contraer panel');
        toggleBtn.title = isCollapsed ? 'Expandir panel (Ctrl+B)' : 'Contraer panel (Ctrl+B)';
      }
      scheduleLayoutRefresh();
    }
  }
});

// Reajustar layout al cambiar el tamaño de ventana / zoom
let layoutResizeTimer = 0;
window.addEventListener('resize', () => {
  clearTimeout(layoutResizeTimer);
  layoutResizeTimer = setTimeout(scheduleLayoutRefresh, 80);
});

init();
</script>
