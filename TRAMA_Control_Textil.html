<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta name="theme-color" content="#0e1931" />
<title>TRAMA · Control de producción textil — MVP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,600;1,700&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   WARM AMBIENT GLASSMORPHISM (TRAMA · PIMIENTA MODA Y ESTILO)
   Efectos de vidrio esmerilado cálido, orbes flotantes, tilt 3D, sidebar colapsable,
   reflejos luminosos, ripples fluidos y portal de acceso seguro.
   ========================================================================== */

:root {
  --font-sans: 'Plus Jakarta Sans', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  
  /* Textos & Contraste */
  --ink: #18181b;
  --ink-soft: #27272a;
  --ink-subtle: #52525b;
  --muted: #71717a;
  --muted-light: #a1a1aa;
  
  /* Acentos Principales: Terracota & Coral Vivo (Pimienta) */
  --coral: #E05A47;
  --coral-dark: #C84633;
  --coral-light: #F06543;
  --coral-gradient: linear-gradient(135deg, #E05A47 0%, #EA580C 45%, #F06543 100%);
  --coral-gradient-hover: linear-gradient(135deg, #D44E3B 0%, #DC5008 45%, #E55735 100%);
  --coral-glow: rgba(224, 90, 71, 0.35);
  
  /* Acentos Secundarios: Ámbar & Esmeralda */
  --amber: #F59E0B;
  --amber-soft: rgba(245, 158, 11, 0.14);
  --emerald: #10B981;
  --emerald-dark: #059669;
  --emerald-soft: rgba(16, 185, 129, 0.12);
  --blue: #2563EB;
  --blue-soft: rgba(37, 99, 235, 0.12);
  --red: #DC2626;
  --red-soft: rgba(220, 38, 38, 0.12);
  
  /* Superficies de Vidrio Esmerilado (Glassmorphism Cálido) */
  --glass-card: rgba(255, 255, 255, 0.68);
  --glass-card-hover: rgba(255, 255, 255, 0.85);
  --glass-border: rgba(255, 255, 255, 0.85);
  --glass-border-subtle: rgba(255, 255, 255, 0.45);
  --glass-shadow: 0 16px 36px -10px rgba(120, 60, 30, 0.08), 0 0 0 1px rgba(255, 255, 255, 0.65) inset;
  --glass-shadow-hover: 0 24px 48px -10px rgba(224, 90, 71, 0.20), 0 0 0 1px rgba(255, 255, 255, 0.95) inset;
  --radius: 22px;
  
  /* Físicas de animación fluida */
  --fx-ease: cubic-bezier(0.22, 1, 0.36, 1);
  --fx-spring: cubic-bezier(0.18, 0.89, 0.32, 1.28);
}

* { box-sizing: border-box; }
html { min-height: 100%; scroll-behavior: smooth; }

body {
  margin: 0;
  min-height: 100vh;
  background: radial-gradient(ellipse at 12% 16%, rgba(224, 90, 71, 0.12) 0%, transparent 46%),
              radial-gradient(ellipse at 88% 84%, rgba(245, 158, 11, 0.10) 0%, transparent 48%),
              radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.7) 0%, transparent 75%),
              linear-gradient(135deg, #FAF8F5 0%, #F3EFE6 48%, #EAE3D3 100%);
  background-size: 130% 130%;
  animation: fxSkyWarm 18s ease-in-out infinite alternate;
  color: var(--ink);
  font-family: var(--font-sans);
  display: grid;
  place-items: center;
  padding: 32px;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  background: radial-gradient(circle at 8% 22%, rgba(255, 255, 255, 0.8) 0%, transparent 35%),
              radial-gradient(circle at 92% 80%, rgba(224, 90, 71, 0.08) 0%, transparent 38%);
  pointer-events: none;
  z-index: 0;
}

@keyframes fxSkyWarm {
  0% { background-position: 0% 0%; }
  100% { background-position: 100% 80%; }
}

/* ==========================================================================
   ESTADO DASHBOARD ACTIVO (Entorno de Trabajo Tras Login)
   ========================================================================== */
body.dashboard-active {
  background: radial-gradient(ellipse at 88% 12%, rgba(224, 90, 71, 0.12) 0%, transparent 45%),
              radial-gradient(ellipse at 15% 85%, rgba(245, 158, 11, 0.09) 0%, transparent 48%),
              linear-gradient(135deg, #FAF8F5 0%, #F3EFE6 45%, #EAE3D3 100%);
  padding: 0;
  display: block;
  min-height: 100vh;
  overflow-x: hidden;
}

/* ==========================================================================
   PANTALLA DE LOGIN (PORTAL DE ENTRADA GLASSMORPHISM)
   ========================================================================== */
.login-view-container {
  width: 100%;
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 2;
  position: relative;
}

.login-shell {
  width: min(1200px, 100%);
  min-height: 680px;
  display: grid;
  grid-template-columns: 1.05fr 1fr;
  background: rgba(255, 255, 255, 0.52);
  backdrop-filter: blur(28px) saturate(160%);
  -webkit-backdrop-filter: blur(28px) saturate(160%);
  border: 1px solid rgba(255, 255, 255, 0.85);
  border-radius: 32px;
  box-shadow: 0 35px 95px -20px rgba(100, 50, 30, 0.18), 0 0 0 1px rgba(255, 255, 255, 0.8) inset;
  overflow: hidden;
  position: relative;
  isolation: isolate;
  z-index: 1;
}

/* Panel Visual Izquierdo (Hero Trama / Pimienta) */
.visual {
  background: radial-gradient(circle at 74% 36%, rgba(224, 90, 71, 0.32) 0%, transparent 55%),
              radial-gradient(circle at 22% 82%, rgba(245, 158, 11, 0.22) 0%, transparent 52%),
              linear-gradient(145deg, #181619 0%, #221b20 54%, #141215 100%);
  color: #FAF8F5;
  position: relative;
  padding: 42px 46px 46px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  isolation: isolate;
}

.visual::before {
  content: "";
  position: absolute;
  inset: 0;
  opacity: 0.14;
  background-image: linear-gradient(rgba(255, 255, 255, 0.35) 1px, transparent 1px),
                    linear-gradient(90deg, rgba(255, 255, 255, 0.35) 1px, transparent 1px);
  background-size: 42px 42px;
  mask-image: linear-gradient(to bottom, transparent, #000 30%, #000 85%, transparent);
}

.visual::after {
  content: "";
  position: absolute;
  width: 580px;
  height: 580px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(224, 90, 71, 0.26), transparent 66%);
  left: calc(50% - 290px);
  top: 18%;
  filter: blur(24px);
  pointer-events: none;
  animation: fxAmbientWarm 14s ease-in-out infinite alternate;
}

@keyframes fxAmbientWarm {
  from { transform: translate(-4%, -4%) scale(0.96); }
  to { transform: translate(5%, 4%) scale(1.08); }
}

.brand-login {
  display: flex;
  align-items: center;
  gap: 13px;
  z-index: 2;
  position: relative;
}

.brand-mark {
  width: 44px;
  height: 44px;
  border: 1px solid rgba(255, 255, 255, 0.45);
  border-radius: 14px;
  display: grid;
  place-items: center;
  color: #FFF;
  background: var(--coral-gradient);
  font-size: 24px;
  font-weight: 800;
  box-shadow: 0 10px 26px rgba(224, 90, 71, 0.4), inset 0 1px 1px rgba(255, 255, 255, 0.5);
}

.brand-title {
  font: 800 19px var(--font-sans);
  letter-spacing: 0.14em;
  color: #FFF;
}

.brand-sub {
  font-size: 10px;
  letter-spacing: 0.20em;
  color: rgba(255, 245, 240, 0.75);
  margin-top: 3px;
  font-weight: 700;
  text-transform: uppercase;
}

.hero-copy {
  position: relative;
  z-index: 3;
  margin-top: 48px;
}

.hero-eyebrow {
  font-weight: 800;
  letter-spacing: 0.20em;
  text-transform: uppercase;
  font-size: 11px;
  color: #F06543;
}

.hero-copy h1 {
  font: 800 clamp(32px, 3.6vw, 48px)/1.14 var(--font-sans);
  letter-spacing: -0.048em;
  max-width: 480px;
  margin: 14px 0 12px;
  color: #FFF;
}

.hero-copy p {
  line-height: 1.68;
  color: rgba(255, 245, 240, 0.85);
  max-width: 420px;
  font-size: 13.5px;
  margin: 0;
}

.orbit {
  height: 250px;
  width: 360px;
  max-width: 95%;
  position: relative;
  margin: 24px auto 0;
  z-index: 2;
  display: grid;
  place-items: center;
  transform: perspective(700px) rotateX(2deg);
  transition: transform 0.4s ease;
}

.ring {
  position: absolute;
  width: 220px;
  height: 220px;
  border-radius: 50%;
  border: 1px solid rgba(240, 101, 67, 0.35);
  box-shadow: 0 0 0 30px rgba(255, 255, 255, 0.04), 0 0 0 60px rgba(224, 90, 71, 0.03);
  animation: fxRingBreathWarm 6s ease-in-out infinite alternate;
}

.ring::before, .ring::after {
  content: "";
  position: absolute;
  inset: 18px;
  border-radius: 50%;
  border: 1px dashed rgba(255, 255, 255, 0.32);
  animation: spin 30s linear infinite;
}

.ring::after {
  inset: 52px;
  border: 1px solid rgba(240, 101, 67, 0.35);
  animation-direction: reverse;
  animation-duration: 22s;
}

@keyframes fxRingBreathWarm {
  to { filter: drop-shadow(0 0 28px rgba(240, 101, 67, 0.6)); transform: scale(1.05); }
}

.halo {
  position: absolute;
  width: 130px;
  height: 130px;
  border-radius: 36px;
  transform: rotate(45deg);
  background: linear-gradient(135deg, rgba(224, 90, 71, 0.32), rgba(255, 255, 255, 0.16));
  border: 1px solid rgba(255, 255, 255, 0.55);
  box-shadow: inset 0 0 45px rgba(224, 90, 71, 0.25), 0 28px 75px rgba(0, 0, 0, 0.45);
  backdrop-filter: blur(20px);
  animation: float 5.5s ease-in-out infinite;
}

.mini-logo {
  font: 800 58px var(--font-sans);
  color: #FFF;
  text-shadow: 0 4px 30px rgba(224, 90, 71, 0.7);
  z-index: 3;
  animation: bob 5.5s ease-in-out infinite;
  letter-spacing: -0.05em;
}

.node {
  position: absolute;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: #E05A47;
  box-shadow: 0 0 0 7px rgba(224, 90, 71, 0.22), 0 0 20px #E05A47;
  z-index: 4;
}

.node.n1 { top: 18px; left: 45px; }
.node.n2 { bottom: 38px; right: 35px; background: #F59E0B; box-shadow: 0 0 0 7px rgba(245, 158, 11, 0.22), 0 0 20px #F59E0B; }
.node.n3 { top: 86px; right: 16px; width: 7px; height: 7px; background: #FFF; }

.data-chip {
  position: absolute;
  z-index: 5;
  background: rgba(30, 24, 28, 0.78);
  border: 1px solid rgba(255, 255, 255, 0.32);
  box-shadow: 0 16px 40px rgba(0, 0, 0, 0.35);
  backdrop-filter: blur(18px);
  border-radius: 14px;
  padding: 12px 16px;
  font-size: 11px;
  letter-spacing: 0.02em;
  animation: float 5.8s ease-in-out infinite;
  color: #FFF;
}

.data-chip small { display: block; color: rgba(255, 235, 225, 0.75); margin-bottom: 5px; font-size: 10px; }
.data-chip strong { font-size: 12px; font-weight: 700; color: #FFF; }
.chip-left { left: 0; bottom: 25px; }
.chip-right { right: 0; top: 18px; animation-delay: -2.5s; }
.chip-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #E05A47; margin-right: 5px; box-shadow: 0 0 8px #E05A47; }

.visual-footer {
  position: relative;
  z-index: 4;
  margin-top: auto;
  padding-top: 18px;
  border-top: 1px solid rgba(255, 255, 255, 0.16);
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 11px;
  color: rgba(255, 240, 235, 0.75);
}

.visual-footer .live { color: #F06543; font-weight: 700; letter-spacing: 0.04em; }

/* Panel Derecho de Formulario */
.login-panel {
  background: linear-gradient(155deg, rgba(255, 255, 255, 0.90) 0%, rgba(248, 244, 236, 0.85) 100%);
  backdrop-filter: blur(28px);
  -webkit-backdrop-filter: blur(28px);
  border-left: 1px solid rgba(255, 255, 255, 0.9);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 48px clamp(28px, 4.8vw, 68px);
  position: relative;
}

.top-tag {
  position: absolute;
  right: 36px;
  top: 32px;
  color: var(--muted);
  font-size: 10.5px;
  font-weight: 800;
  letter-spacing: 0.16em;
}

.form-wrap {
  width: 100%;
  max-width: 400px;
  animation: enter 0.8s var(--fx-ease) both;
}

.lock-icon {
  height: 52px;
  width: 52px;
  background: linear-gradient(135deg, rgba(224, 90, 71, 0.14), rgba(245, 158, 11, 0.08));
  border: 1px solid rgba(224, 90, 71, 0.28);
  border-radius: 16px;
  display: grid;
  place-items: center;
  color: #E05A47;
  margin-bottom: 24px;
  box-shadow: 0 10px 24px rgba(224, 90, 71, 0.16);
  animation: fxLockBreatheWarm 4.8s ease-in-out infinite alternate;
}

@keyframes fxLockBreatheWarm {
  to { box-shadow: 0 0 32px rgba(224, 90, 71, 0.35); transform: translateY(-3px); }
}

.lock-icon svg { width: 24px; height: 24px; }

.form-wrap h2 {
  font: 800 clamp(28px, 3.2vw, 36px)/1.2 var(--font-sans);
  letter-spacing: -0.048em;
  margin: 0 0 10px;
  color: var(--ink);
}

.login-intro {
  color: var(--muted);
  font-size: 13.5px;
  line-height: 1.65;
  margin: 0 0 30px;
}

.login-field { margin: 0 0 20px; }
.login-field label {
  font-weight: 700;
  font-size: 12px;
  display: block;
  margin: 0 0 8px;
  color: var(--ink-soft);
}

.input-shell {
  display: flex;
  align-items: center;
  height: 54px;
  border-radius: 14px;
  border: 1px solid rgba(215, 205, 195, 0.75);
  background: rgba(255, 255, 255, 0.85);
  box-shadow: 0 4px 14px rgba(0, 0, 0, 0.03);
  transition: border-color 0.25s, box-shadow 0.25s, transform 0.25s var(--fx-ease);
  position: relative;
}

.input-shell:focus-within {
  border-color: #E05A47;
  box-shadow: 0 0 0 4px rgba(224, 90, 71, 0.18);
  transform: translateY(-2px);
}

.input-shell > svg {
  height: 18px;
  width: 18px;
  margin: 0 14px 0 18px;
  color: #a1a1aa;
  flex: none;
}

.input-shell input, .input-shell select {
  background: transparent;
  border: 0;
  outline: 0;
  min-width: 0;
  flex: 1;
  font: 500 13.5px var(--font-sans);
  color: var(--ink);
  padding: 0 12px 0 0;
  height: 100%;
}

.input-shell input::placeholder { color: #a1a1aa; }

.eye-btn {
  width: 44px;
  height: 44px;
  border: 0;
  background: transparent;
  color: #a1a1aa;
  cursor: pointer;
  display: grid;
  place-items: center;
  border-radius: 10px;
  margin-right: 6px;
  transition: color 0.2s, background 0.2s;
}

.eye-btn:hover { color: #E05A47; background: rgba(224, 90, 71, 0.08); }
.eye-btn svg { width: 18px; height: 18px; }

.login-options {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  margin-top: 4px;
  margin-bottom: 26px;
  font-size: 12px;
}

.remember {
  display: flex;
  gap: 8px;
  align-items: center;
  color: var(--ink-subtle);
  cursor: pointer;
  font-weight: 500;
}

.remember input {
  accent-color: #E05A47;
  width: 16px;
  height: 16px;
  margin: 0;
}

.forgot-link {
  color: #E05A47;
  font-weight: 700;
  text-decoration: none;
  transition: color 0.2s;
}

.forgot-link:hover { text-decoration: underline; color: #C84633; }

.submit-btn {
  width: 100%;
  height: 54px;
  border: 0;
  border-radius: 14px;
  background: var(--coral-gradient);
  color: #FFF;
  cursor: pointer;
  font: 700 14px var(--font-sans);
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 12px;
  box-shadow: 0 16px 34px -8px rgba(224, 90, 71, 0.48);
  transition: transform 0.25s var(--fx-ease), background 0.25s, box-shadow 0.25s;
  position: relative;
  isolation: isolate;
  overflow: hidden;
}

.submit-btn::before {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  background: linear-gradient(120deg, transparent 15%, rgba(255, 255, 255, 0.45) 45%, transparent 65%);
  transform: translateX(-120%);
  animation: fxSubmitGlint 4.8s ease-in-out infinite;
}

@keyframes fxSubmitGlint {
  0%, 40% { transform: translateX(-120%); }
  75%, 100% { transform: translateX(120%); }
}

.submit-btn:hover {
  transform: translateY(-2px);
  background: var(--coral-gradient-hover);
  box-shadow: 0 22px 42px -6px rgba(224, 90, 71, 0.58);
}

.submit-btn:active { transform: translateY(0); }
.submit-btn svg { width: 17px; height: 17px; transition: transform 0.2s; }
.submit-btn:hover svg { transform: translateX(4px); }

.login-helper {
  margin: 24px 0 0;
  line-height: 1.65;
  text-align: center;
  color: var(--muted);
  font-size: 11px;
}

.login-helper strong { color: var(--ink-soft); font-weight: 600; }
.login-message { min-height: 18px; font-size: 12px; color: #DC2626; margin-top: 10px; line-height: 1.5; font-weight: 600; }

.demo-pill {
  position: absolute;
  left: 50%;
  bottom: 22px;
  transform: translateX(-50%);
  white-space: nowrap;
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--muted);
  font-size: 10px;
  letter-spacing: 0.10em;
  font-weight: 700;
}

.demo-pill span {
  width: 6px;
  height: 6px;
  background: #E05A47;
  border-radius: 50%;
  box-shadow: 0 0 8px #E05A47;
}

/* ==========================================================================
   APP SHELL / WORKSPACE (TUTOR GLASS XR LAYOUT)
   ========================================================================== */
.app {
  min-height: 100vh;
  display: flex;
  position: relative;
  width: 100%;
}

/* ────────── BARRA LATERAL COLAPSABLE (Sidebar - Code XR Style) ────────── */
.sidebar {
  position: sticky;
  top: 0;
  height: 100vh;
  flex: 0 0 256px;
  width: 256px;
  background: linear-gradient(175deg, #18171a 0%, #201a1d 58%, #141215 100%);
  border-right: 1px solid rgba(255, 255, 255, 0.12);
  color: #FFF;
  padding: 30px 18px 24px;
  display: flex;
  flex-direction: column;
  box-shadow: 16px 0 45px rgba(20, 10, 15, 0.14);
  backdrop-filter: blur(28px);
  -webkit-backdrop-filter: blur(28px);
  z-index: 110;
  overflow-x: hidden;
  overflow-y: auto;
  transition: flex 0.35s var(--fx-ease), flex-basis 0.35s var(--fx-ease), width 0.35s var(--fx-ease), padding 0.35s var(--fx-ease);
}

.sidebar::before {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  background: radial-gradient(circle at 25% 15%, rgba(224, 90, 71, 0.18) 0%, transparent 35%),
              radial-gradient(circle at 80% 85%, rgba(245, 158, 11, 0.12) 0%, transparent 40%);
}

.sidebar::after {
  content: "";
  position: absolute;
  inset: -100% -50%;
  background: linear-gradient(105deg, transparent 44%, rgba(255, 255, 255, 0.05) 49%, rgba(255, 255, 255, 0.12) 50%, transparent 56%);
  pointer-events: none;
  animation: fxSideLight 14s linear infinite;
}

@keyframes fxSideLight { to { transform: translateX(50%); } }

.brand-sidebar {
  display: flex;
  gap: 12px;
  align-items: center;
  margin: 0 6px 36px;
  position: relative;
  z-index: 2;
  transition: margin 0.3s var(--fx-ease), justify-content 0.3s;
}

.brand-symbol {
  width: 44px;
  height: 44px;
  min-width: 44px;
  background: var(--coral-gradient);
  color: #FFF;
  border-radius: 14px;
  display: grid;
  place-items: center;
  font: 800 24px var(--font-sans);
  box-shadow: 0 10px 24px rgba(224, 90, 71, 0.45);
  border: 1px solid rgba(255, 255, 255, 0.4);
  flex: none;
}

.brand-name {
  font: 800 18px var(--font-sans);
  letter-spacing: 0.12em;
  color: #FFF;
  white-space: nowrap;
}

.brand-caption {
  color: rgba(255, 235, 225, 0.72);
  font: 700 9.5px var(--font-sans);
  letter-spacing: 0.18em;
  margin-top: 3px;
  text-transform: uppercase;
  white-space: nowrap;
}

/* Botón de Colapso (<) de la Barra Lateral */
.sidebar-collapse-toggle {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.12);
  border: 1px solid rgba(255, 255, 255, 0.25);
  color: #FFF;
  display: grid;
  place-items: center;
  cursor: pointer;
  margin-left: auto;
  transition: background 0.25s, transform 0.35s var(--fx-ease), border-color 0.2s;
  flex: none;
  padding: 0;
}

.sidebar-collapse-toggle svg { width: 15px; height: 15px; stroke-width: 2.5; transition: transform 0.35s var(--fx-ease); }
.sidebar-collapse-toggle:hover { background: rgba(224, 90, 71, 0.85); border-color: rgba(255, 255, 255, 0.5); transform: scale(1.08); }

/* ESTADO COLAPSADO DE LA BARRA LATERAL (Width: 256px -> 76px) */
.sidebar.collapsed {
  flex: 0 0 76px !important;
  width: 76px !important;
  padding: 26px 12px 20px !important;
  align-items: center !important;
}

.sidebar.collapsed .brand-sidebar {
  margin: 0 0 32px 0 !important;
  justify-content: center !important;
  gap: 0 !important;
}

.sidebar.collapsed .brand-sidebar > div:not(.brand-symbol),
.sidebar.collapsed .menu-label,
.sidebar.collapsed .nav-item span,
.sidebar.collapsed .nav-item.active::after,
.sidebar.collapsed .side-foot,
.sidebar.collapsed .sidebar-logout span {
  display: none !important;
  opacity: 0 !important;
  visibility: hidden !important;
}

.sidebar.collapsed .sidebar-collapse-toggle {
  position: absolute;
  right: -10px;
  top: 14px;
  transform: rotate(180deg) !important;
  background: rgba(224, 90, 71, 0.9) !important;
  box-shadow: 0 4px 12px rgba(224, 90, 71, 0.4);
}

.sidebar.collapsed .nav {
  width: 100% !important;
  display: flex !important;
  flex-direction: column !important;
  align-items: center !important;
}

.sidebar.collapsed .nav-item {
  width: 48px !important;
  height: 48px !important;
  min-height: 48px !important;
  padding: 0 !important;
  justify-content: center !important;
  border-radius: 14px !important;
}

.sidebar.collapsed .nav-item svg {
  margin: 0 !important;
  width: 22px !important;
  height: 22px !important;
}

.sidebar.collapsed .fx-nav-track {
  width: 48px !important;
  left: calc(50% - 24px) !important;
}

.sidebar.collapsed .sidebar-bottom {
  width: 100% !important;
  display: flex !important;
  justify-content: center !important;
}

.sidebar.collapsed .sidebar-logout {
  width: 48px !important;
  height: 48px !important;
  min-height: 48px !important;
  padding: 0 !important;
  justify-content: center !important;
  margin: 8px auto 0 !important;
}

.menu-label {
  font-size: 10px;
  color: #a1a1aa;
  letter-spacing: 0.20em;
  text-transform: uppercase;
  font-weight: 800;
  padding: 0 16px;
  margin: 0 0 14px;
  position: relative;
  z-index: 2;
  white-space: nowrap;
}

.nav {
  display: grid;
  gap: 7px;
  position: relative;
  isolation: isolate;
  z-index: 2;
}

.fx-nav-track {
  position: absolute;
  left: 0;
  right: 0;
  top: 0;
  height: 50px;
  z-index: -1;
  border-radius: 14px;
  background: rgba(255, 255, 255, 0.95);
  box-shadow: 0 10px 26px rgba(0, 0, 0, 0.25), inset 0 1px 2px #FFF;
  border: 1px solid rgba(255, 255, 255, 0.95);
  transition: transform 0.45s var(--fx-ease), height 0.45s var(--fx-ease), opacity 0.2s, width 0.35s var(--fx-ease), left 0.35s var(--fx-ease);
  opacity: 0;
  pointer-events: none;
}

.nav-item {
  font: 600 13px var(--font-sans);
  min-height: 50px;
  width: 100%;
  border: 1px solid transparent;
  border-radius: 14px;
  background: transparent;
  color: #d4d4d8;
  display: flex;
  align-items: center;
  gap: 14px;
  text-align: left;
  padding: 0 15px;
  cursor: pointer;
  transition: background 0.25s, color 0.25s, transform 0.25s var(--fx-ease);
  position: relative;
  z-index: 1;
}

.nav-item svg { width: 19px; height: 19px; flex: none; transition: transform 0.2s, color 0.2s; }

.nav-item:hover {
  background: rgba(255, 255, 255, 0.08);
  color: #FFF;
  transform: translateX(4px);
}

.nav-item.active {
  background: rgba(255, 255, 255, 0.96) !important;
  color: #18181b !important;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.22) !important;
  font-weight: 700;
}

.nav-item.active svg { color: #E05A47; }

.nav-item.active::after {
  content: '';
  margin-left: auto;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: #E05A47;
  box-shadow: 0 0 0 3px rgba(224, 90, 71, 0.25);
}

.sidebar-bottom {
  margin-top: auto;
  position: relative;
  z-index: 2;
}

.side-foot {
  padding: 16px;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.14);
  border-radius: 16px;
  margin: 16px 2px 14px;
  box-shadow: inset 0 1px rgba(255, 255, 255, 0.2);
  font-size: 11.5px;
  color: #d4d4d8;
  line-height: 1.55;
}

.side-foot strong { color: #FFF; }
.online-dot {
  display: inline-block;
  width: 7px;
  height: 7px;
  background: #10B981;
  border-radius: 50%;
  margin-right: 6px;
  box-shadow: 0 0 8px #10B981;
}

.sidebar-logout {
  width: 100%;
  min-height: 44px;
  border-radius: 12px;
  background: rgba(255, 255, 255, 0.06);
  border: 1px solid rgba(255, 255, 255, 0.14);
  color: #fca5a5;
  font-size: 12px;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 14px;
  cursor: pointer;
  transition: background 0.2s, color 0.2s, transform 0.2s;
}

.sidebar-logout:hover {
  background: rgba(220, 38, 38, 0.2);
  color: #FFF;
  border-color: rgba(220, 38, 38, 0.4);
  transform: translateY(-2px);
}

.sidebar-logout svg { width: 17px; height: 17px; }

/* ────────── ÁREA DE CONTENIDO (main & topbar) ────────── */
.main {
  min-width: 0;
  flex: 1;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  position: relative;
  z-index: 1;
}

.topbar {
  height: 82px;
  min-height: 82px;
  display: flex;
  align-items: center;
  gap: 20px;
  justify-content: space-between;
  padding: 0 clamp(24px, 3.6vw, 54px);
  border-bottom: 1px solid rgba(255, 255, 255, 0.8);
  background: rgba(255, 255, 255, 0.72);
  backdrop-filter: blur(24px) saturate(160%);
  -webkit-backdrop-filter: blur(24px) saturate(160%);
  position: sticky;
  top: 0;
  z-index: 104;
  box-shadow: 0 6px 20px rgba(120, 60, 30, 0.04);
  animation: fxSlideDown 0.6s var(--fx-ease) both;
}

.breadcrumb {
  display: flex;
  align-items: center;
  gap: 6px;
  color: var(--muted);
  font-size: 13px;
  font-weight: 500;
}

.breadcrumb b {
  color: var(--ink);
  font-weight: 800;
  font-size: 14.5px;
}

.top-controls {
  display: flex;
  align-items: center;
  gap: 12px;
}

.avatar {
  border-radius: 14px;
  width: 42px;
  height: 42px;
  background: var(--coral-gradient);
  color: #FFF;
  display: grid;
  place-items: center;
  font: 800 17px var(--font-sans);
  box-shadow: 0 8px 22px rgba(224, 90, 71, 0.38);
  border: 1px solid rgba(255, 255, 255, 0.6);
}

.user-pick {
  height: 44px;
  background: rgba(255, 255, 255, 0.85);
  border: 1px solid rgba(255, 255, 255, 0.95);
  color: var(--ink-soft);
  border-radius: 13px;
  padding: 0 34px 0 14px;
  font-size: 12.5px;
  font-weight: 600;
  outline-color: var(--coral);
  box-shadow: 0 4px 14px rgba(0, 0, 0, 0.03);
  cursor: pointer;
  transition: border-color 0.2s, box-shadow 0.2s;
}

.user-pick:focus {
  border-color: #E05A47;
  box-shadow: 0 0 0 3px rgba(224, 90, 71, 0.15);
}

.content {
  padding: 32px clamp(24px, 3.6vw, 54px) 80px;
  flex: 1;
  position: relative;
  z-index: 1;
}

/* ────────── ENCABEZADOS Y BANNERS ────────── */
.eyebrow {
  display: flex;
  align-items: center;
  gap: 8px;
  color: #E05A47;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  font-weight: 800;
  font-size: 10.5px;
  margin-bottom: 8px;
}

.eyebrow::before {
  content: '';
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #E05A47;
  box-shadow: 0 0 0 4px rgba(224, 90, 71, 0.2);
}

.pagehead {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 20px;
  margin-bottom: 26px;
}

.pagehead h1 {
  font: 800 clamp(26px, 2.8vw, 36px)/1.15 var(--font-sans);
  letter-spacing: -0.048em;
  margin: 0 0 8px;
  color: var(--ink);
}

.pagehead p {
  margin: 0;
  color: var(--muted);
  font-size: 13.5px;
  max-width: 720px;
  line-height: 1.6;
}

.actions {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
}

.banner {
  display: flex;
  gap: 14px;
  align-items: flex-start;
  background: rgba(255, 255, 255, 0.72);
  border: 1px solid rgba(255, 255, 255, 0.95);
  box-shadow: var(--glass-shadow);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  color: #3f3f46;
  padding: 15px 18px;
  border-radius: 16px;
  margin-bottom: 26px;
  font-size: 12.5px;
  line-height: 1.65;
}

.banner svg {
  flex-shrink: 0;
  width: 20px;
  height: 20px;
  margin-top: 1px;
  color: #E05A47;
}

.banner strong { color: #18181b; }

/* ────────── BOTONES GLASSMORPHIC ────────── */
.btn {
  border: 1px solid transparent;
  padding: 10px 18px;
  border-radius: 13px;
  font-weight: 700;
  font-size: 13px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 9px;
  line-height: 1.3;
  min-height: 42px;
  background: var(--coral-gradient);
  color: white;
  cursor: pointer;
  box-shadow: 0 10px 24px rgba(224, 90, 71, 0.35);
  transition: transform 0.25s var(--fx-ease), box-shadow 0.25s, background 0.25s;
  position: relative;
  overflow: hidden;
}

.btn:hover:not(:disabled) {
  transform: translateY(-2px);
  background: var(--coral-gradient-hover);
  box-shadow: 0 16px 32px rgba(224, 90, 71, 0.48);
}

.btn:active:not(:disabled) { transform: translateY(0); }

.btn.secondary {
  background: rgba(255, 255, 255, 0.85);
  color: var(--ink-soft);
  border: 1px solid rgba(255, 255, 255, 0.95);
  box-shadow: 0 4px 16px rgba(120, 60, 30, 0.05);
}

.btn.secondary:hover:not(:disabled) {
  background: #FFF;
  color: #E05A47;
  border-color: rgba(224, 90, 71, 0.35);
  box-shadow: 0 10px 24px rgba(224, 90, 71, 0.16);
}

.btn.danger {
  background: rgba(255, 255, 255, 0.9);
  color: var(--red);
  border: 1px solid rgba(220, 38, 38, 0.3);
  box-shadow: 0 4px 16px rgba(220, 38, 38, 0.08);
}

.btn.danger:hover:not(:disabled) {
  background: #FEF2F2;
  border-color: var(--red);
  box-shadow: 0 10px 24px rgba(220, 38, 38, 0.2);
}

.btn.sm {
  font-size: 12px;
  min-height: 34px;
  padding: 6px 12px;
  border-radius: 10px;
}

.btn:disabled { opacity: 0.45; cursor: not-allowed; }

/* ────────── TARJETAS Y PANELES GLASSMORPHISM ────────── */
.kpis {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 18px;
  margin-bottom: 24px;
}

.kpi {
  background: rgba(255, 255, 255, 0.68);
  border-radius: var(--radius);
  padding: 22px 22px 18px;
  border: 1px solid rgba(255, 255, 255, 0.85);
  box-shadow: var(--glass-shadow);
  backdrop-filter: blur(24px) saturate(170%);
  -webkit-backdrop-filter: blur(24px) saturate(170%);
  transition: transform 0.3s var(--fx-ease), box-shadow 0.3s var(--fx-ease);
  position: relative;
  overflow: hidden;
}

.kpi:hover {
  transform: translateY(-5px);
  box-shadow: var(--glass-shadow-hover);
  border-color: rgba(255, 255, 255, 0.98);
}

.kpi-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  color: var(--muted);
  font-size: 12px;
  font-weight: 700;
}

.kpi-icon {
  width: 40px;
  height: 40px;
  display: grid;
  place-items: center;
  border-radius: 13px;
  background: rgba(224, 90, 71, 0.12);
  color: #E05A47;
  border: 1px solid rgba(224, 90, 71, 0.22);
  transition: transform 0.35s var(--fx-ease);
}

.kpi:hover .kpi-icon {
  transform: translateY(-3px) rotate(-6deg) scale(1.1);
  box-shadow: 0 8px 22px rgba(224, 90, 71, 0.3);
}

.kpi-value {
  font-size: 32px;
  font-weight: 850;
  line-height: 1.15;
  margin: 12px 0 4px;
  letter-spacing: -0.04em;
  font-variant-numeric: tabular-nums;
  color: var(--ink);
}

.kpi-note {
  font-size: 11.5px;
  color: var(--muted);
  font-weight: 500;
}

.section-grid {
  display: grid;
  grid-template-columns: 1.45fr 1fr;
  gap: 20px;
  margin-top: 20px;
}

.panel {
  background: rgba(255, 255, 255, 0.68);
  border: 1px solid rgba(255, 255, 255, 0.85);
  border-radius: var(--radius);
  box-shadow: var(--glass-shadow);
  backdrop-filter: blur(24px) saturate(170%);
  -webkit-backdrop-filter: blur(24px) saturate(170%);
  min-width: 0;
  overflow: hidden;
  position: relative;
  transition: transform 0.3s var(--fx-ease), box-shadow 0.3s var(--fx-ease);
}

.panel:hover {
  box-shadow: var(--glass-shadow-hover);
}

.panel-head {
  padding: 22px 24px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
}

.panel-title {
  font-size: 16px;
  font-weight: 850;
  letter-spacing: -0.02em;
  color: var(--ink);
}

.panel-sub {
  color: var(--muted);
  font-size: 12px;
  margin-top: 2px;
}

.panel-body {
  padding: 0 24px 22px;
}

/* ────────── TABLAS CON ESTILO VIDRIO ESMERILADO ────────── */
.table-wrap {
  overflow: auto;
  max-width: 100%;
}

.data-table {
  border-collapse: collapse;
  width: 100%;
  min-width: 610px;
}

.data-table th {
  text-align: left;
  color: #71717a;
  text-transform: uppercase;
  letter-spacing: 0.07em;
  font-size: 10.5px;
  font-weight: 850;
  background: rgba(250, 248, 245, 0.6);
  border-top: 1px solid rgba(220, 210, 200, 0.45);
  padding: 13px 14px;
  white-space: nowrap;
}

.data-table td {
  padding: 14px;
  border-top: 1px solid rgba(220, 210, 200, 0.35);
  vertical-align: middle;
  font-size: 13px;
}

.data-table tr:hover td {
  background: rgba(255, 255, 255, 0.85);
}

.maincol { font-weight: 800; color: #18181b; }
.subcol { font-size: 11px; color: var(--muted); margin-top: 2px; }
.mono { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; letter-spacing: -0.02em; }

/* ────────── TAGS / BADGES MODERNOS ────────── */
.tag {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  white-space: nowrap;
  padding: 4px 10px;
  font-size: 11px;
  font-weight: 800;
  border-radius: 99px;
  background: rgba(220, 210, 200, 0.35);
  color: #52525b;
}

.tag.green { background: rgba(16, 185, 129, 0.14); color: #059669; border: 1px solid rgba(16, 185, 129, 0.25); }
.tag.orange { background: rgba(245, 158, 11, 0.14); color: #D97706; border: 1px solid rgba(245, 158, 11, 0.25); }
.tag.red { background: rgba(220, 38, 38, 0.14); color: #DC2626; border: 1px solid rgba(220, 38, 38, 0.25); }
.tag.blue { background: rgba(37, 99, 235, 0.14); color: #2563EB; border: 1px solid rgba(37, 99, 235, 0.25); }
.tag.teal { background: rgba(224, 90, 71, 0.14); color: #E05A47; border: 1px solid rgba(224, 90, 71, 0.28); }
.tag.gray { background: rgba(113, 113, 122, 0.12); color: #52525b; }

/* ────────── BARRAS DE PROGRESO CON SHIMMER ────────── */
.progress {
  height: 8px;
  background: rgba(220, 210, 200, 0.45);
  border-radius: 20px;
  overflow: hidden;
  min-width: 80px;
  position: relative;
}

.progress > span {
  height: 100%;
  background: var(--coral-gradient);
  display: block;
  border-radius: inherit;
  position: relative;
  overflow: hidden;
}

.progress > span::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(90deg, transparent 0%, rgba(255, 255, 255, 0.6) 50%, transparent 100%);
  animation: fxShimmer 2.4s linear infinite;
  transform: translateX(-120%);
}

@keyframes fxShimmer { to { transform: translateX(150%); } }

.progress-meta { display: flex; align-items: center; gap: 9px; font-size: 12px; }
.stat-line { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 12px; margin-bottom: 8px; }
.stage-mini { padding: 14px 0; border-bottom: 1px solid rgba(220, 210, 200, 0.35); }
.stage-mini:last-child { border: 0; }
.stage-name { font-weight: 750; }
.tiny-muted { color: var(--muted); font-size: 11px; }

/* ────────── PESTAÑAS DE ETAPAS (Work Stages) ────────── */
.stage-tabs {
  display: flex;
  gap: 9px;
  overflow: auto;
  padding: 4px 0 18px;
}

.stage-tab {
  white-space: nowrap;
  background: rgba(255, 255, 255, 0.85);
  border: 1px solid rgba(255, 255, 255, 0.95);
  color: var(--ink-subtle);
  border-radius: 12px;
  padding: 10px 18px;
  font-weight: 700;
  cursor: pointer;
  box-shadow: 0 4px 14px rgba(120, 60, 30, 0.04);
  transition: transform 0.2s var(--fx-ease), border-color 0.2s, background 0.2s, color 0.2s;
}

.stage-tab:hover {
  transform: translateY(-2px);
  border-color: rgba(224, 90, 71, 0.35);
  color: #E05A47;
}

.stage-tab.active {
  border-color: rgba(255, 255, 255, 0.4);
  background: var(--coral-gradient);
  color: #FFF;
  box-shadow: 0 8px 24px rgba(224, 90, 71, 0.38);
}

/* ────────── GRID DE LOTES ────────── */
.lot-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 18px;
}

.lot-card {
  background: rgba(255, 255, 255, 0.68);
  border: 1px solid rgba(255, 255, 255, 0.85);
  border-radius: var(--radius);
  padding: 22px;
  box-shadow: var(--glass-shadow);
  backdrop-filter: blur(24px) saturate(170%);
  -webkit-backdrop-filter: blur(24px) saturate(170%);
  transition: transform 0.3s var(--fx-ease), box-shadow 0.3s var(--fx-ease);
}

.lot-card:hover {
  transform: translateY(-5px);
  box-shadow: var(--glass-shadow-hover);
}

.lot-card-top {
  display: flex;
  justify-content: space-between;
  gap: 12px;
}

.lot-name {
  font-size: 16px;
  font-weight: 850;
  margin: 4px 0 2px;
  color: var(--ink);
}

.lot-meta { font-size: 12px; color: var(--muted); }

.lot-metrics {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  margin: 16px 0;
}

.lot-measure {
  background: rgba(250, 248, 245, 0.7);
  border: 1px solid rgba(220, 210, 200, 0.4);
  border-radius: 12px;
  padding: 11px 12px;
}

.lot-measure b {
  display: block;
  font-size: 22px;
  line-height: 1.2;
  letter-spacing: -0.04em;
  color: var(--ink);
}

.lot-measure span { font-size: 11px; color: var(--muted); }
.lot-card .actions { margin-top: 14px; }

/* ────────── MODAL GLASSMORPHISM ────────── */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(20, 15, 18, 0.65);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  z-index: 150;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.modal {
  width: 100%;
  max-width: 660px;
  max-height: min(92vh, 920px);
  overflow: auto;
  border-radius: 26px;
  background: rgba(255, 255, 255, 0.94);
  border: 1px solid rgba(255, 255, 255, 0.95);
  box-shadow: 0 35px 95px rgba(20, 10, 15, 0.35);
  backdrop-filter: blur(28px);
  -webkit-backdrop-filter: blur(28px);
  animation: fxCardEnter 0.4s var(--fx-ease) both;
}

.modal-head {
  padding: 24px 28px 18px;
  border-bottom: 1px solid rgba(220, 210, 200, 0.45);
  display: flex;
  justify-content: space-between;
  gap: 15px;
  align-items: flex-start;
}

.modal-head h2 { font-size: 21px; margin: 0 0 4px; letter-spacing: -0.03em; color: var(--ink); }
.modal-head p { font-size: 12.5px; color: var(--muted); margin: 0; }

.icon-close {
  border: 1px solid rgba(220, 205, 195, 0.7);
  background: rgba(255, 255, 255, 0.85);
  color: var(--muted);
  width: 34px;
  height: 34px;
  border-radius: 10px;
  font-size: 20px;
  line-height: 1;
  display: grid;
  place-items: center;
  cursor: pointer;
  transition: color 0.2s, border-color 0.2s, transform 0.2s;
}

.icon-close:hover { color: #E05A47; border-color: #E05A47; transform: scale(1.05); }

.modal-content { padding: 22px 28px 26px; }

/* ────────── CAMPOS Y FORMULARIOS DENTRO DEL PANEL ────────── */

.field input, .field select, .field textarea, .filters input, .filters select {

.detail-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin: 18px 0; }
.detail-grid .lot-measure { background: rgba(255, 255, 255, 0.7); }

.compact-list { display: flex; flex-direction: column; }

.compact-row:first-child { border-top: 0; }

.audit-balance {

  border: 1px solid rgba(16, 185, 129, 0.3);

.audit-balance.error { background: rgba(254, 242, 242, 0.7); border-color: rgba(220, 38, 38, 0.3); }

.audit-balance.error b { color: #DC2626; }

.timeline { display: flex; flex-direction: column; }

.event-dot { width: 24px; height: 24px; border-radius: 8px; display: grid; place-items: center; background: rgba(224, 90, 71, 0.14); color: #E05A47; font-size: 11px; font-weight: 900; flex-shrink: 0; }

.empty { padding: 38px 24px; color: var(--muted); text-align: center; }
.empty svg { width: 28px; height: 28px; color: #a1a1aa; display: block; margin: 0 auto 10px; }
.empty strong { display: block; color: #3f3f46; margin-bottom: 5px; }

.admin-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
.settings-box { padding: 22px; }
.settings-box h3 { font-size: 16px; margin: 0 0 6px; }
.settings-box p { color: var(--muted); font-size: 12px; margin: 0 0 16px; }
.role-dot { display: inline-block; width: 8px; height: 8px; border-radius: 99px; background: #10B981; margin-right: 8px; box-shadow: 0 0 6px #10B981; }

.toast {
  position: fixed;
  bottom: 26px;
  right: 26px;
  z-index: 200;
  background: linear-gradient(135deg, #18171a, #241c21);
  color: white;
  padding: 14px 20px;

.toast.show { opacity: 1; transform: translateY(0); }
.toast.bad { background: linear-gradient(135deg, #881337, #4c0519); border-color: rgba(244, 63, 94, 0.3); }

/* ────────── EFECTOS VISUALES V3 (Orbes, Tilt 3D, Ripples) ────────── */
.fx-atmosphere { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }

.fx-orb {
  position: absolute;
  display: block;

  border: 1px solid rgba(255, 255, 255, 0.7);
  box-shadow: inset 18px 15px 28px rgba(255, 255, 255, 0.75), inset -18px -20px 38px rgba(224, 90, 71, 0.35), 0 20px 48px rgba(224, 90, 71, 0.18);

}

.fx-orb.one { width: 190px; height: 190px; top: 6%; left: 26%; --dur: 18s; background: linear-gradient(140deg, rgba(255, 240, 230, 0.65), rgba(224, 90, 71, 0.25)); opacity: 0.45; }
.fx-orb.two { width: 320px; height: 320px; top: 46%; left: 76%; --dur: 24s; background: linear-gradient(130deg, rgba(254, 240, 210, 0.7), rgba(245, 158, 11, 0.2)); opacity: 0.42; animation-delay: -5s; }
.fx-orb.three { width: 95px; height: 95px; top: 68%; left: 10%; --dur: 14s; background: linear-gradient(145deg, rgba(255, 255, 255, 0.8), rgba(224, 90, 71, 0.28)); opacity: 0.5; animation-delay: -4s; }
.fx-orb.four { width: 70px; height: 70px; top: 10%; right: 12%; --dur: 12s; background: linear-gradient(145deg, rgba(255, 255, 255, 0.8), rgba(240, 101, 67, 0.45)); opacity: 0.6; animation-delay: -3s; }

@keyframes fxOrbFloat {
  from { transform: translate3d(-18px, 20px, 0) rotate(-12deg) scale(0.98); }
  to { transform: translate3d(32px, -42px, 0) rotate(18deg) scale(1.12); }
}

.fx-tilt {
  position: relative;
  isolation: isolate;
  transform-style: preserve-3d;
  --fx-rx: 0deg;
  --fx-ry: 0deg;
  --fx-px: 50%;
  --fx-py: 50%;
  --fx-lift: 0px;
  transform: perspective(950px) rotateX(var(--fx-rx)) rotateY(var(--fx-ry)) translate3d(0, var(--fx-lift), 0) !important;
  transition: transform 0.32s var(--fx-ease), box-shadow 0.32s var(--fx-ease), border-color 0.32s !important;
  will-change: transform;
}

.fx-tilt:hover {
  --fx-lift: -6px;
  box-shadow: 0 28px 56px -8px rgba(224, 90, 71, 0.20), 0 0 0 1px rgba(255, 255, 255, 0.95), inset 0 1px #FFF !important;
  border-color: rgba(255, 255, 255, 0.95) !important;
}

.fx-tilt::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 5;
  pointer-events: none;
  border-radius: inherit;
  background: radial-gradient(320px circle at var(--fx-px) var(--fx-py), rgba(255, 255, 255, 0.72), rgba(224, 90, 71, 0.15) 32%, transparent 65%);
  mix-blend-mode: screen;
  opacity: 0;
  transition: opacity 0.28s ease;
}

.fx-tilt:hover::after { opacity: 0.85; }
.fx-tilt > * { position: relative; z-index: 2; }

.fx-ripple {
  position: absolute;
  z-index: 9;
  display: block;
  width: 16px;
  height: 16px;
  border-radius: 50%;
  left: var(--x);
  top: var(--y);
  background: rgba(255, 255, 255, 0.85);
  pointer-events: none;
  transform: translate(-50%, -50%) scale(0);
  animation: fxRipple 0.65s ease-out forwards;
  mix-blend-mode: screen;
}

@keyframes fxRipple {
  to { transform: translate(-50%, -50%) scale(20); opacity: 0; }
}

@keyframes enter {
  from { opacity: 0; transform: translateY(18px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes spin { to { transform: rotate(360deg); } }
@keyframes bob { 50% { transform: translateY(-10px); } }
@keyframes float { 50% { transform: translateY(-10px) rotate(45deg); } }

/* ==========================================================================
   CASCADA DE ENTRADA STAGGERED
   ========================================================================== */
@keyframes fxCardEnter {
  from {
    opacity: 0;
    transform: translateY(24px) scale(0.97);
    filter: blur(4px);
  }
  to {
    opacity: 1;
    transform: translateY(0) scale(1);
    filter: blur(0);
  }
}

@keyframes fxSlideDown {
  from { opacity: 0; transform: translateY(-16px); }
  to { opacity: 1; transform: translateY(0); }
}

.kpi:nth-child(1) { animation: fxCardEnter 0.6s var(--fx-ease) both 0.08s; }
.kpi:nth-child(2) { animation: fxCardEnter 0.6s var(--fx-ease) both 0.16s; }
.kpi:nth-child(3) { animation: fxCardEnter 0.6s var(--fx-ease) both 0.24s; }
.kpi:nth-child(4) { animation: fxCardEnter 0.6s var(--fx-ease) both 0.32s; }
.panel:nth-child(1) { animation: fxCardEnter 0.65s var(--fx-ease) both 0.20s; }
.panel:nth-child(2) { animation: fxCardEnter 0.65s var(--fx-ease) both 0.28s; }

/* ────────── RESPONSIVE ────────── */

}

  .orbit { display: none; }

  .kpis { grid-template-columns: 1fr 1fr; gap: 10px; }
  .detail-grid { grid-template-columns: repeat(2, 1fr); }
  .admin-grid { grid-template-columns: 1fr; }
}

@media(max-width: 480px) {
  .kpis { grid-template-columns: 1fr; }
  .actions { width: 100%; }
}

<script>
'use strict';

const STAGES=['corte','confeccion','acabados','empaque'];

const icon=(id)=>`<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[id]||ICONS.box}</svg>`;
const esc=(v)=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=(v)=>Number(v)||0, fmt=(v)=>new Intl.NumberFormat('es-CO').format(num(v)), now=()=>new Date().toISOString(), time=(x)=>new Date(x).toLocaleString('es-CO',{dateStyle:'short',timeStyle:'short'});
const id=(prefix)=>prefix+'-'+(globalThis.crypto?.randomUUID?crypto.randomUUID().slice(0,8):Math.random().toString(36).slice(2,11)).toUpperCase();
const clone=(x)=>JSON.parse(JSON.stringify(x));
const blankStocks=(qty)=>({corte:{pending:qty,ready:0},confeccion:{pending:0,ready:0},acabados:{pending:0,ready:0},empaque:{pending:0,ready:0},transit:0,held:0,incidents:0,finished:0,scrap:0});
const PLANT_CATALOG=[
  {area:'corte',areaName:'Corte',task:'Tender y trazar · Cortar piezas',cost:2300,worker:'Camila',workers:['Camila','Mateo'],defaultActive:true},
  {area:'sublimacion',areaName:'Sublimación',task:'Imprimir y sublimar',cost:2500,worker:'Julián',workers:['Julián'],defaultActive:true},
  {area:'confeccion',areaName:'Costura / Confección',task:'Coser · Pegar elástico',cost:4700,worker:'Laura',workers:['Laura'],defaultActive:true},
  {area:'acabados',areaName:'Fileteado / Acabados',task:'Filetear costuras · Ruedo y puños',cost:2400,worker:'Andrés',workers:['Andrés'],defaultActive:true},
  {area:'empaque',areaName:'Empaque',task:'Doblar · Empaquetar y etiquetar',cost:1200,worker:'Valentina',workers:['Valentina','Sofía'],defaultActive:true}
];
let db,view='dashboard',stageView='corte',lotChoice='',orderChoice='',modal=null,filterText='',toastTimer,weekOffset=0,loggedIn=false;
function defaultDB(){return {version:1,demo:true,seq:{order:0,lot:0,transfer:0},users:[{id:'u1',name:'Administrador',role:'admin'},{id:'u2',name:'Supervisora de planta',role:'supervisor'},{id:'u3',name:'Camila (Corte)',role:'corte'},{id:'u4',name:'Laura (Confección)',role:'confeccion'},{id:'u5',name:'Andrés (Acabados)',role:'acabados'},{id:'u6',name:'Valentina (Empaque)',role:'empaque'},{id:'u7',name:'Julián (Sublimación)',role:'confeccion'}],currentUser:'u1',orders:[],lots:[],settlements:[],transfers:[],holds:[],incidents:[],events:[]};}
const current=()=>db.users.find(u=>u.id===db.currentUser)||db.users[0];
const isManager=()=>['admin','supervisor'].includes(current().role);
const authorized=(stage)=>isManager()||current().role===stage;
const hasAdmin=()=>current().role==='admin';
function requireRight(condition,msg='No tienes permisos para realizar esta acción en la demostración.') {if(!condition)throw Error(msg);}

function save(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(db));}catch(err){notify('No se pudo guardar en este navegador. Exporta una copia JSON.',true)}}
function getLot(lotId){const x=db.lots.find(l=>l.id===lotId);if(!x)throw Error('No se encontró el lote.');return x;}
function getOrder(orderId){return db.orders.find(o=>o.id===orderId);}
function sumStock(l){return STAGES.reduce((a,s)=>a+l.stocks[s].pending+l.stocks[s].ready,0)+l.stocks.transit+l.stocks.held+l.stocks.incidents+l.stocks.finished+l.stocks.scrap;}
function verifyAll(data=db){for(const l of data.lots){if(!Number.isInteger(l.planned)||l.planned<=0||!l.stocks)throw Error('Lote inválido');for(const s of STAGES){if(!l.stocks[s]||!Number.isInteger(l.stocks[s].pending)||!Number.isInteger(l.stocks[s].ready)||l.stocks[s].pending<0||l.stocks[s].ready<0)throw Error('Saldo de área inválido')}for(const k of ['transit','held','incidents','finished','scrap'])if(!Number.isInteger(l.stocks[k])||l.stocks[k]<0)throw Error('Saldo de control inválido');if(sumStock(l)!==l.planned)throw Error('Descuadre del lote '+l.code)}}
function transact(fn){const old=clone(db);try{fn();verifyAll();save();modal=null;render();notify('Operación registrada correctamente.');}catch(err){db=old;notify(err.message||'No fue posible completar la operación.',true);console.error(err)}}
function log(lotId,type,description,qty,actor,meta={}){db.events.push({id:id('EV'),lotId,type,description,qty,actor:actor||current().name,when:now(),meta});}
function createOrder(input,actor){let lines=input.lines.filter(r=>Number(r.qty)>0);if(!lines.length)throw Error('Debes especificar al menos una talla y cantidad.');if(!input.reference?.trim()||!input.design?.trim())throw Error('Referencia y diseño son obligatorios.');if(lines.some(r=>!Number.isInteger(Number(r.qty))||Number(r.qty)<=0))throw Error('Las cantidades deben ser enteros positivos.');let sizes=new Set();for(const l of lines){const key=String(l.size||'').trim().toUpperCase();if(!key||sizes.has(key))throw Error('Las tallas deben ser únicas y no vacías.');sizes.add(key)}const year=new Date().getFullYear(),orderId=id('OP'),code=`OP-${year}-${String(++db.seq.order).padStart(3,'0')}`;const totalUnits=lines.reduce((s,l)=>s+Number(l.qty),0);const assignments=input.assignments&&input.assignments.length?input.assignments:clone(PLANT_CATALOG);const unitLaborCost=assignments.reduce((s,t)=>s+Number(t.cost||0),0);const totalLaborCost=unitLaborCost*totalUnits;db.orders.push({id:orderId,code,reference:input.reference.trim().toUpperCase(),design:input.design.trim().toUpperCase(),customer:(input.customer||'Producción para inventario').trim(),due:input.due||'',notes:input.notes||'',assignments,laborCostSnapshot:{unitCost:unitLaborCost,totalCost:totalLaborCost},createdAt:now(),createdBy:actor||current().name});for(const line of lines){const lotId=id('LOT'),lotCode=`LT-${year}-${String(++db.seq.lot).padStart(4,'0')}`,planned=Number(line.qty);db.lots.push({id:lotId,code:lotCode,orderId,size:String(line.size).trim().toUpperCase(),planned,stocks:blankStocks(planned),createdAt:now()});log(lotId,'CREADA',`Orden ${code} creada. ${planned} unidades a Corte. M.O. congelada: $ ${fmt(unitLaborCost)}/ud.`,planned,actor,{stage:'corte',qty:planned,orderId});}return orderId;}
function processLot(lotId,stage,good,actor){const l=getLot(lotId),b=l.stocks[stage];good=Number(good);if(!STAGES.includes(stage))throw Error('Área incorrecta.');if(!Number.isInteger(good)||good<=0||good>b.pending)throw Error(`Debes ingresar una cantidad válida entre 1 y ${b.pending}.`);b.pending-=good;const idx=STAGES.indexOf(stage);if(idx<STAGES.length-1){const nextStage=STAGES[idx+1];l.stocks[nextStage].pending+=good;}else{l.stocks.finished+=good;}const o=getOrder(l.orderId);const assign=(o?.assignments||[]).find(a=>a.area===stage)||PLANT_CATALOG.find(a=>a.area===stage);const worker=actor||assign?.worker||current().name;log(lotId,'TRABAJO',`${LABELS[stage]}: ${good} unidades completadas por ${worker}.${idx===STAGES.length-1?' Ingresadas a Producto Terminado.':` Avanzadas a ${LABELS[STAGES[idx+1]]}.`}`,good,worker,{stage,qty:good,orderId:l.orderId,cost:assign?.cost||0});}
function getWeekNumber(d){const target=new Date(d.valueOf());const dayNr=(d.getDay()+6)%7;target.setDate(target.getDate()-dayNr+3);const firstThursday=target.valueOf();target.setMonth(0,1);if(target.getDay()!==4)target.setMonth(0,1+((4-target.getDay())+7)%7);return 1+Math.ceil((firstThursday-target)/604800000);}
function getWeekRange(offset=0){const now=new Date();const day=now.getDay();const diffToMonday=(day===0?-6:1)-day;const monday=new Date(now);monday.setDate(now.getDate()+diffToMonday+(offset*7));monday.setHours(0,0,0,0);const sunday=new Date(monday);sunday.setDate(monday.getDate()+6);sunday.setHours(23,59,59,999);const weekKey=`${monday.getFullYear()}-W${String(getWeekNumber(monday)).padStart(2,'0')}`;const label=`${monday.toLocaleDateString('es-CO',{day:'numeric',month:'short'})} – ${sunday.toLocaleDateString('es-CO',{day:'numeric',month:'short',year:'numeric'})}`;return {monday,sunday,weekKey,label,offset};}
function getPayItemsForWeek(range){const {monday,sunday,weekKey}=range;db.settlements=db.settlements||[];const settlement=db.settlements.find(s=>s.weekKey===weekKey);if(settlement&&settlement.items){return {isClosed:true,settlement,items:settlement.items,total:settlement.total,people:settlement.people};}const items=[];for(const e of db.events){if(e.type!=='TRABAJO'&&e.type!=='PROCESO')continue;const when=new Date(e.when);if(when<monday||when>sunday)continue;const l=db.lots.find(x=>x.id===e.lotId);if(!l)continue;const o=db.orders.find(x=>x.id===l.orderId);if(!o)continue;const stage=e.meta?.stage||(e.description.toLowerCase().includes('corte')?'corte':e.description.toLowerCase().includes('confección')||e.description.toLowerCase().includes('confeccion')?'confeccion':e.description.toLowerCase().includes('acabados')?'acabados':e.description.toLowerCase().includes('empaque')?'empaque':'corte');const assignment=(o.assignments||[]).find(a=>a.area===stage)||PLANT_CATALOG.find(a=>a.area===stage)||{task:LABELS[stage],cost:2000,worker:e.actor||'Operario',workers:[e.actor||'Operario']};const qty=Number(e.qty)||0;const rawWorkers=assignment.workers&&assignment.workers.length?assignment.workers:[assignment.worker];const n=rawWorkers.length;const unitRate=assignment.cost;const splitRate=Math.round(unitRate/n);for(let i=0;i<n;i++){const workerName=rawWorkers[i];const personRate=(i===n-1)?(unitRate-splitRate*(n-1)):splitRate;const subtotal=qty*personRate;items.push({id:e.id+'-'+i,eventId:e.id,lotId:l.id,lotCode:l.code,orderId:o.id,orderCode:o.code,reference:o.reference,design:o.design,size:l.size,stage:stage,areaName:LABELS[stage]||stage,task:assignment.task,worker:workerName,isTeam:n>1,teamCount:n,qty:qty,unitRate:personRate,fullRate:unitRate,total:subtotal,when:e.when});}}const peopleMap={};for(const it of items){if(!peopleMap[it.worker]){peopleMap[it.worker]={name:it.worker,total:0,units:0,items:[]};}peopleMap[it.worker].total+=it.total;peopleMap[it.worker].units+=it.qty;peopleMap[it.worker].items.push(it);}const people=Object.values(peopleMap).sort((a,b)=>b.total-a.total);const total=items.reduce((s,it)=>s+it.total,0);return {isClosed:false,settlement:null,items,total,people};}
function closeWeek(weekKey){requireRight(isManager());const range=getWeekRange(weekOffset);if(range.weekKey!==weekKey)throw Error('La semana a cerrar no coincide.');const data=getPayItemsForWeek(range);if(!data.items.length)throw Error('No hay movimientos registrados para cerrar en esta semana.');db.settlements=db.settlements||[];if(db.settlements.some(s=>s.weekKey===weekKey))throw Error('Esta semana ya se encuentra cerrada.');db.settlements.push({weekKey,weekLabel:range.label,closedAt:now(),closedBy:current().name,total:data.total,peopleCount:data.people.length,unitsCount:data.items.reduce((s,i)=>s+i.qty,0),items:clone(data.items),people:clone(data.people)});}
function reopenWeek(weekKey){requireRight(hasAdmin(),'Solo el Administrador puede reabrir una semana cerrada.');db.settlements=db.settlements||[];const idx=db.settlements.findIndex(s=>s.weekKey===weekKey);if(idx<0)throw Error('No se encontró el cierre de esta semana.');db.settlements.splice(idx,1);}
function exportPayrollCSV(range,data){const rows=[['Semana','Persona','Área','Tarea','Orden','Referencia','Diseño','Lote','Talla','Unidades','Tarifa unitaria COP','Total COP']];for(const it of data.items){rows.push([range.weekKey,it.worker,it.areaName,it.task,it.orderCode,it.reference,it.design,it.lotCode,it.size,it.qty,it.unitRate,it.total]);}download('Liquidacion_'+range.weekKey+'.csv','\ufeff'+rows.map(r=>r.map(csvSafe).join(';')).join('\r\n'),'text/csv');}
function createDemo(){db=defaultDB();db.settlements=[];const allTasks=clone(PLANT_CATALOG);let a=createOrder({reference:'PIJAMA SHORT NIÑO',design:'RAPUNZEL',customer:'Inventario para temporada',due:'',lines:[{size:'6',qty:8},{size:'8',qty:8},{size:'10',qty:8}],assignments:allTasks},'Sistema de demostración');let b=createOrder({reference:'PIJAMA PANTALÓN NIÑO',design:'STICH AZUL NAVIDAD',customer:'Pedido mayorista — ejemplo',lines:[{size:'6',qty:12},{size:'8',qty:12}],assignments:allTasks},'Sistema de demostración');let c=createOrder({reference:'SHORT TIRA DAMA',design:'MÁRMOL ROSA',customer:'Colección tienda',lines:[{size:'S',qty:10},{size:'M',qty:10},{size:'L',qty:10}],assignments:allTasks.filter(t=>t.area!=='sublimacion')},'Sistema de demostración');let [a1,a2,a3]=db.lots.filter(l=>l.orderId===a);processLot(a1.id,'corte',8,'Camila');processLot(a1.id,'confeccion',8,'Laura');processLot(a1.id,'acabados',8,'Andrés');processLot(a1.id,'empaque',8,'Valentina');processLot(a2.id,'corte',8,'Camila');processLot(a2.id,'confeccion',6,'Laura');processLot(a3.id,'corte',8,'Camila');let b1=db.lots.find(l=>l.orderId===b);processLot(b1.id,'corte',12,'Mateo');processLot(b1.id,'confeccion',5,'Laura');let c1=db.lots.find(l=>l.orderId===c);processLot(c1.id,'corte',10,'Camila');verifyAll();return db;}
function init(){try{const raw=localStorage.getItem(STORAGE_KEY);if(raw){const d=JSON.parse(raw);if(d.version!==1||!Array.isArray(d.orders)||!Array.isArray(d.lots)||!Array.isArray(d.transfers)||!Array.isArray(d.holds)||!Array.isArray(d.incidents)||!Array.isArray(d.events)||!Array.isArray(d.users))throw Error('Formato no compatible');db=d;verifyAll();if(!db.users.some(u=>u.id===db.currentUser))db.currentUser=db.users[0].id;for(const o of db.orders){if(!o.assignments)o.assignments=clone(PLANT_CATALOG);if(!o.laborCostSnapshot){const unit=o.assignments.reduce((a,t)=>a+t.cost,0);const target=db.lots.filter(l=>l.orderId===o.id).reduce((s,l)=>s+l.planned,0);o.laborCostSnapshot={unitCost:unit,totalCost:unit*target};}}}else createDemo();}catch(err){console.warn('No se pudo restaurar archivo local',err);createDemo();}try{ if(sessionStorage.getItem('trama_logged_in')==='true') loggedIn=true; }catch{} save();render();}
function totals(){return db.lots.reduce((o,l)=>(o.planned+=l.planned,o.finished+=l.stocks.finished,o.transit+=l.stocks.transit,o.quality+=l.stocks.held+l.stocks.incidents,o.scrap+=l.stocks.scrap,o),{planned:0,finished:0,transit:0,quality:0,scrap:0});}
function orderLots(o){return db.lots.filter(l=>l.orderId===o.id);}
function orderProgress(o){const ls=orderLots(o),target=ls.reduce((s,l)=>s+l.planned,0),done=ls.reduce((s,l)=>s+l.stocks.finished,0),worked=ls.some(l=>l.stocks.corte.pending<l.planned);return {target,done,worked,pct:target?Math.round(done/target*100):0};}
function orderStatus(p){return p.done===p.target?'Finalizada':p.worked?'En proceso':'Pendiente';}
function tag(text,kind='gray'){return `<span class="tag ${kind}">${esc(text)}</span>`;}
function lotDetail(l){const o=getOrder(l.orderId);return `${o?o.reference+' · '+o.design:'Orden sin referencia'} · Talla ${l.size}`;}
function lineProgress(p){return `<div class="progress-meta"><div class="progress" style="flex:1"><span style="width:${p.pct}%"></span></div><span class="mono">${p.pct}%</span></div>`;}
function header(title,desc,action=''){return `<div class="pagehead"><div><div class="eyebrow">Operación / ${esc(title)}</div><h1>${esc(title)}</h1><p>${esc(desc)}</p></div><div class="actions">${action}</div></div>`;}

function renderDashboard(){const t=totals(),curRange=getWeekRange(weekOffset),curPay=getPayItemsForWeek(curRange),activeOrders=db.orders.filter(o=>orderProgress(o).pct<100).length,evs=[...db.events].reverse().slice(0,6);return `${header('Centro de producción y destajo','Visibilidad de órdenes, avance en planta y liquidación semanal por destajo en tiempo real.',`<button class="btn" data-action="new-order" ${isManager()?'':'disabled'}>${icon('plus')} Nueva orden</button>`)}<div class="kpis">${kpi('Unidades planificadas',t.planned,`${db.orders.length} órdenes registradas`,'layers')}${kpi('Producto terminado',t.finished,t.planned?`${Math.round(t.finished/t.planned*100)}% de lo planificado`:'Sin órdenes','check')}${kpi('Destajo semana activa','$ '+fmt(curPay.total),`${curPay.people.length} personas con pago · ${curRange.label}`,'wallet')}${kpi('Órdenes activas',activeOrders,'Producción en marcha','scissors')}</div><div class="section-grid"><section class="panel"><div class="panel-head"><div><div class="panel-title">Órdenes recientes</div><div class="panel-sub">Avance hasta producto terminado y mano de obra</div></div><button class="btn secondary sm" data-nav="orders">Ver todas ${icon('chev')}</button></div><div class="table-wrap"><table class="data-table"><thead><tr><th>Orden / referencia</th><th>Meta</th><th>Terminadas</th><th>Avance</th><th>M.O. Prenda</th></tr></thead><tbody>${[...db.orders].reverse().slice(0,5).map(o=>{let p=orderProgress(o),snap=o.laborCostSnapshot||{unitCost:13100};return `<tr><td><span class="maincol mono">${esc(o.code)}</span><div class="subcol">${esc(o.reference)} · ${esc(o.design)}</div></td><td class="mono">${fmt(p.target)}</td><td class="mono">${fmt(p.done)}</td><td style="min-width:130px">${lineProgress(p)}</td><td class="mono"><strong>$ ${fmt(snap.unitCost)}</strong></td></tr>`}).join('')||'<tr><td colspan="5" class="empty">No hay órdenes registradas.</td></tr>'}</tbody></table></div></section><section class="panel"><div class="panel-head"><div><div class="panel-title">Estado de planta por etapa</div><div class="panel-sub">Unidades pendientes de proceso</div></div></div><div class="panel-body">${STAGES.map(s=>{let pend=db.lots.reduce((a,l)=>a+l.stocks[s].pending,0),max=Math.max(1,t.planned);return `<div class="stage-mini"><div class="stat-line"><span class="stage-name">${LABELS[s]}</span><span><b>${fmt(pend)}</b> <span class="tiny-muted">uds pendientes</span></span></div><div class="progress"><span style="width:${Math.min(100,(pend/max)*100)}%"></span></div></div>`}).join('')}<div class="inline-details">${tag('Destajo activo: $ '+fmt(curPay.total),'teal')}${tag(curPay.people.length+' operarios en nómina','green')}</div></div></section></div><div class="section-grid"><section class="panel"><div class="panel-head"><div><div class="panel-title">Actividad de producción</div><div class="panel-sub">Historial de registros y avances</div></div><button class="btn secondary sm" data-nav="payroll">Liquidación ${icon('chev')}</button></div><div class="panel-body"><div class="timeline">${evs.map(e=>`<div class="event"><div class="event-dot">${e.type==='TRABAJO'?'✓':e.type==='CREADA'?'✦':'•'}</div><div class="event-content"><div class="event-desc">${esc(e.description)}</div><div class="event-extra">${esc(getLot(e.lotId)?.code||'')} · ${esc(e.actor)} · ${time(e.when)}</div></div></div>`).join('')||'<div class="empty">Aún no hay movimientos.</div>'}</div></div></section><section class="panel"><div class="panel-head"><div><div class="panel-title">Reglas de planta y destajo</div><div class="panel-sub">Modelo operativo Pimienta</div></div></div><div class="panel-body"><div class="compact-list"><div class="compact-row"><div><div class="compact-row-name">Destajo = Tarifa × Unidades</div><div class="compact-row-desc">Pago por prendas efectivamente procesadas en cada área.</div></div>${tag('Activo','green')}</div><div class="compact-row"><div><div class="compact-row-name">Tarifas congeladas en la OP</div><div class="compact-row-desc">Cambios en el catálogo no alteran el valor pactado de la orden.</div></div>${tag('Activo','green')}</div><div class="compact-row"><div><div class="compact-row-name">Reparto de equipos 1/N</div><div class="compact-row-desc">Parejas de taller o empaque dividen la tarifa equitativamente.</div></div>${tag('Activo','green')}</div><div class="compact-row"><div><div class="compact-row-name">Cierre semanal Lun–Dom</div><div class="compact-row-desc">Permite cerrar la nómina y congelar montos pagados.</div></div>${tag('Activo','green')}</div></div></div></section></div>`;}
function renderOrders(){return `${header('Órdenes de producción','Cada orden contiene curva de tallas por lote y asignación congelada de tareas con tarifa de mano de obra.',`<button class="btn" data-action="new-order" ${isManager()?'':'disabled'}>${icon('plus')} Crear orden</button>`)}<section class="panel"><div class="panel-head"><div><div class="panel-title">Órdenes registradas</div><div class="panel-sub">${db.orders.length} órdenes · ${db.lots.length} lotes</div></div></div><div class="table-wrap"><table class="data-table"><thead><tr><th>Orden</th><th>Referencia / diseño</th><th>Cliente / destino</th><th>Lotes</th><th>Unidades</th><th>Mano de obra</th><th>Avance</th><th>Detalle</th></tr></thead><tbody>${[...db.orders].reverse().map(o=>{let p=orderProgress(o);let unitM=o.laborCostSnapshot?.unitCost||(o.assignments||[]).reduce((a,t)=>a+t.cost,0)||13100;let totM=o.laborCostSnapshot?.totalCost||(unitM*p.target);return `<tr><td class="maincol mono">${esc(o.code)}<div class="subcol">${time(o.createdAt)}</div></td><td><div class="maincol">${esc(o.reference)}</div><div class="subcol">${esc(o.design)}</div></td><td>${esc(o.customer)}</td><td>${orderLots(o).length}</td><td><strong>${fmt(p.done)}</strong> / ${fmt(p.target)}</td><td class="mono"><strong>$ ${fmt(unitM)}</strong><div class="subcol">Total: $ ${fmt(totM)}</div></td><td style="min-width:130px">${lineProgress(p)}</td><td><button class="btn secondary sm" data-action="order-detail" data-id="${esc(o.id)}">Ver detalle</button></td></tr>`}).join('')||'<tr><td colspan="8" class="empty">Crea la primera orden de producción.</td></tr>'}</tbody></table></div></section>${orderChoice&&db.orders.some(o=>o.id===orderChoice)?renderOrderDetail(getOrder(orderChoice)):''}`;}
function renderOrderDetail(o){const ls=orderLots(o),p=orderProgress(o);const snap=o.laborCostSnapshot||{unitCost:(o.assignments||[]).reduce((a,t)=>a+t.cost,0)||13100,totalCost:0};const unitCost=snap.unitCost||(o.assignments||[]).reduce((a,t)=>a+t.cost,0);const totalCost=snap.totalCost||(unitCost*p.target);const earnedCost=unitCost*p.done;const assignments=o.assignments&&o.assignments.length?o.assignments:PLANT_CATALOG;return `<section class="panel" style="margin-top:18px"><div class="panel-head"><div><div class="panel-title">${esc(o.code)} · ${esc(o.design)}</div><div class="panel-sub">${esc(o.reference)} · ${esc(o.customer)} · ${fmt(p.target)} unidades</div></div><button class="btn secondary sm" data-action="close-order-detail">Cerrar</button></div><div class="panel-body" style="padding-bottom:6px"><div class="detail-grid" style="margin:12px 0 16px"><div class="lot-measure"><b>$ ${fmt(unitCost)}</b><span>M.O. / Prenda (congelada)</span></div><div class="lot-measure"><b>$ ${fmt(totalCost)}</b><span>Presupuesto total M.O.</span></div><div class="lot-measure"><b>$ ${fmt(earnedCost)}</b><span>Devengado (${p.done} uds listas)</span></div><div class="lot-measure"><b>$ ${fmt(totalCost-earnedCost)}</b><span>Saldo pendiente M.O.</span></div></div><div style="font-weight:760;font-size:12.5px;color:#33455b;margin:12px 0 6px">Asignación de Planta y Tarifas por Prenda</div><div class="table-wrap" style="margin-bottom:18px"><table class="data-table"><thead><tr><th>Área de planta</th><th>Tarea asignada</th><th>Persona responsable</th><th>Tarifa / prenda</th><th>Total asignado OP</th></tr></thead><tbody>${assignments.map(a=>`<tr><td class="maincol">${esc(a.areaName)}</td><td>${esc(a.task)}</td><td><span class="tag teal">👤 ${esc(a.worker)}</span></td><td class="mono"><strong>$ ${fmt(a.cost)}</strong></td><td class="mono">$ ${fmt(a.cost*p.target)}</td></tr>`).join('')}</tbody></table></div><div style="font-weight:760;font-size:12.5px;color:#33455b;margin:10px 0 6px">Lotes por Talla (Curva de Producción)</div></div><div class="table-wrap"><table class="data-table"><thead><tr><th>Lote</th><th>Talla</th><th>Meta</th><th>Corte</th><th>Confección</th><th>Acabados</th><th>Empaque</th><th>Terminadas</th><th>Detalle</th></tr></thead><tbody>${ls.map(l=>`<tr><td class="maincol mono">${esc(l.code)}</td><td>${esc(l.size)}</td><td>${fmt(l.planned)}</td>${STAGES.map(s=>`<td>${fmt(l.stocks[s].pending)}</td>`).join('')}<td><strong>${fmt(l.stocks.finished)}</strong></td><td><button class="btn secondary sm" data-action="trace-lot" data-id="${esc(l.id)}">Historial</button></td></tr>`).join('')}</tbody></table></div></section>`;}
function renderWork(){const isTrace=stageView==='trazabilidad';const tabs=[...STAGES.map(s=>`<button class="stage-tab ${s===stageView?'active':''}" data-stage="${s}">${LABELS[s]}</button>`),`<button class="stage-tab ${isTrace?'active':''}" data-stage="trazabilidad">${icon('trace')} Trazabilidad y auditoría</button>`].join('');if(isTrace){const selected=db.lots.find(l=>l.id===lotChoice)||db.lots[0];if(selected)lotChoice=selected.id;const events=selected?[...db.events].filter(e=>e.lotId===selected.id).reverse():[];return `${header('Producción / Trazabilidad por lote','Consulta el saldo de cada área, movimientos e historial de auditoría de cualquier lote sin salir de Producción.')}<div class="stage-tabs">${tabs}</div><div class="filters"><label class="screen-reader" for="lot-choice">Elegir lote</label><select id="lot-choice" aria-label="Elegir lote">${db.lots.map(l=>`<option value="${esc(l.id)}" ${l.id===lotChoice?'selected':''}>${esc(l.code)} · ${esc(getOrder(l.orderId).design)} · Talla ${esc(l.size)}</option>`).join('')}</select><button class="btn secondary" data-action="export-csv">${icon('download')} CSV de saldos</button></div>${selected?`<div class="section-grid trace-layout"><section class="panel"><div class="panel-head"><div><div class="panel-title">${esc(selected.code)} · Talla ${esc(selected.size)}</div><div class="panel-sub">${esc(lotDetail(selected))}</div></div></div><div class="panel-body">${traceTable(selected)}</div></section><section class="panel"><div class="panel-head"><div><div class="panel-title">Historial inalterado por operaciones</div><div class="panel-sub">${events.length} eventos registrados para este lote</div></div></div><div class="panel-body"><div class="timeline" style="max-height:590px;overflow:auto">${events.map(e=>`<div class="event"><div class="event-dot">${e.type==='TRABAJO'?'✓':e.type==='CREADA'?'✦':'•'}</div><div class="event-content"><div class="event-desc">${esc(e.description)}</div><div class="event-extra">${esc(e.type)} · ${esc(e.actor)} · ${time(e.when)}</div></div></div>`).join('')||'<p class="empty">No hay registros para este lote.</p>'}</div></div></section></div>`:`<section class="panel empty">No hay lotes todavía.</section>`}`;}return `${header('Producción por área','Registra las unidades procesadas en cada estación. El avance traslada las unidades a la siguiente etapa y acumula el pago por destajo.') }<div class="stage-tabs">${tabs}</div><div class="lot-grid">${db.lots.filter(l=>l.stocks[stageView].pending>0||l.stocks.finished>0).map(l=>{const b=l.stocks[stageView],o=getOrder(l.orderId);let assign=(o.assignments||[]).find(a=>a.area===stageView)||PLANT_CATALOG.find(a=>a.area===stageView);return `<section class="lot-card"><div class="lot-card-top"><div><div class="eyebrow mono">${esc(l.code)} · ${esc(o.code)}</div><div class="lot-name">${esc(o.reference)}</div><div class="lot-meta">${esc(o.design)} · Talla ${esc(l.size)}</div></div>${tag(b.pending>0?'En estación':'Completado en '+LABELS[stageView],b.pending>0?'teal':'gray')}</div><div class="lot-metrics"><div class="lot-measure"><b>${fmt(l.planned)}</b><span>Meta total</span></div><div class="lot-measure"><b>${fmt(b.pending)}</b><span>Pendientes en ${LABELS[stageView]}</span></div><div class="lot-measure"><b>${fmt(l.stocks.finished)}</b><span>Terminadas</span></div></div>${assign?`<div style="font-size:11px;color:#18534c;background:#e9f6f3;padding:6px 9px;border-radius:7px;margin:10px 0 6px;display:flex;justify-content:space-between;align-items:center"><span>👤 <b>${esc(assign.worker)}</b> · ${esc(assign.task)}</span><span><b>$ ${fmt(assign.cost)}</b> / ud</span></div>`:''}<div class="actions"><button class="btn sm" data-action="process" data-id="${esc(l.id)}" data-stage="${stageView}" ${b.pending>0?'':'disabled'}>${icon('check')} Registrar trabajo</button><button class="btn secondary sm" data-action="trace-lot" data-id="${esc(l.id)}">${icon('trace')} Trazabilidad</button></div></section>`;}).join('')||`<section class="panel empty" style="grid-column:1/-1">${icon('box')}<strong>No hay unidades pendientes en ${LABELS[stageView]}.</strong>Completa trabajo en la etapa anterior o crea una nueva orden para iniciar producción.</section>`}</div><div class="note">Cada vez que se registra trabajo en una etapa, las prendas completadas pasan directamente a la siguiente estación (o a Producto Terminado en Empaque) y se liquidan automáticamente a nombre del operario en la <b>Liquidación semanal</b>.</div>`;}
function renderPayroll(){const range=getWeekRange(weekOffset),data=getPayItemsForWeek(range),totalUnits=data.items.reduce((s,i)=>s+i.qty,0),totalLots=new Set(data.items.map(i=>i.lotId)).size,areaTotals={};for(const it of data.items){if(!areaTotals[it.stage])areaTotals[it.stage]={name:it.areaName,total:0,units:0};areaTotals[it.stage].total+=it.total;areaTotals[it.stage].units+=it.qty;}const actions=`<div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap"><div style="display:flex;gap:4px"><button class="btn secondary sm" data-action="prev-week" title="Semana anterior">← Ant.</button><button class="btn secondary sm" data-action="current-week" ${weekOffset===0?'disabled':''}>Actual</button><button class="btn secondary sm" data-action="next-week" title="Semana siguiente" ${weekOffset>=0?'disabled':''}>Sig. →</button></div>${data.isClosed?`<button class="btn danger sm" data-action="reopen-week" data-week="${esc(range.weekKey)}" ${hasAdmin()?'':'disabled'}>Reabrir semana</button>`:`<button class="btn sm" data-action="close-week" data-week="${esc(range.weekKey)}" ${isManager()&&data.items.length?'':'disabled'}>${icon('check')} Cerrar semana</button>`}<button class="btn secondary sm" data-action="print-payroll">${icon('download')} Imprimir</button><button class="btn secondary sm" data-action="export-payroll">${icon('download')} CSV</button></div>`;return `${header('Liquidación semanal por destajo',`Ventana de pago: <b>${esc(range.label)}</b> (${esc(range.weekKey)})`,actions)}${data.isClosed?`<div class="banner" style="background:#eaf2fb;border-color:#c8dbf4;color:#274f82">${icon('info')}<span><strong>Semana cerrada y congelada.</strong> Cerrada por <b>${esc(data.settlement.closedBy)}</b> el ${time(data.settlement.closedAt)}. Los montos se encuentran protegidos ante cambios de tarifas posteriores.</span></div>`:''}<div class="kpis">${kpi('Total a liquidar','$ '+fmt(data.total),`${data.people.length} personas con pago`,'wallet')}${kpi('Prendas liquidadas',totalUnits,'Unidades procesadas','layers')}${kpi('Lotes involucrados',totalLots,'Lotes con avance','scissors')}${kpi('Estado de semana',data.isClosed?'Cerrada':'Abierta',data.isClosed?'Liquidación congelada':'Acumulación en vivo','check')}</div><section class="panel" style="margin-bottom:18px"><div class="panel-head"><div><div class="panel-title">Mano de obra por área de planta</div><div class="panel-sub">Destajo generado en la semana lun–dom</div></div></div><div class="panel-body"><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px">${STAGES.map(s=>{const at=areaTotals[s]||{name:LABELS[s],total:0,units:0};return `<div style="background:#f8fafc;border:1px solid #e7ebf0;border-radius:10px;padding:12px"><div style="font-size:11px;font-weight:750;color:#64748b;text-transform:uppercase">${esc(at.name)}</div><div style="font-size:20px;font-weight:850;color:#0e7c72;margin:4px 0 2px">$ ${fmt(at.total)}</div><div class="tiny-muted">${fmt(at.units)} unidades producidas</div></div>`;}).join('')}</div></div></section><div style="display:flex;flex-direction:column;gap:18px">${data.people.map(p=>`<section class="panel"><div class="panel-head" style="background:#fafbfc;border-bottom:1px solid var(--border)"><div style="display:flex;align-items:center;gap:12px"><div class="avatar" style="background:#0b8a8d;color:#fff;font-weight:850">${esc(p.name.charAt(0).toUpperCase())}</div><div><div class="panel-title" style="font-size:16px">${esc(p.name)}</div><div class="panel-sub">${fmt(p.units)} prendas liquidadas · ${p.items.length} tareas</div></div></div><div style="text-align:right"><span class="tiny-muted" style="text-transform:uppercase;font-size:10px;font-weight:800;display:block">Total a pagar</span><span style="font-size:22px;font-weight:850;color:#07625a;letter-spacing:-.03em">$ ${fmt(p.total)}</span></div></div><div class="table-wrap"><table class="data-table"><thead><tr><th>Lote / Talla</th><th>OP / Referencia / Diseño</th><th>Área / Tarea</th><th>Unidades</th><th>Tarifa aplicada</th><th>Total</th><th>Fecha</th></tr></thead><tbody>${p.items.map(it=>`<tr><td class="maincol mono">${esc(it.lotCode)}<div class="subcol">Talla ${esc(it.size)}</div></td><td><b>${esc(it.orderCode)}</b><div class="subcol">${esc(it.reference)} · ${esc(it.design)}</div></td><td><span class="tag teal">${esc(it.areaName)}</span><div class="subcol">${esc(it.task)}</div></td><td class="mono"><strong>${fmt(it.qty)}</strong></td><td class="mono">$ ${fmt(it.unitRate)}${it.isTeam?`<div class="subcol" style="color:#007567">Reparto 1/${it.teamCount} de $ ${fmt(it.fullRate)}</div>`:''}</td><td class="mono" style="font-weight:800;color:#07625a">$ ${fmt(it.total)}</td><td class="subcol">${time(it.when)}</td></tr>`).join('')}</tbody></table></div></section>`).join('')||`<section class="panel empty">${icon('box')}<strong>Sin pagos acumulados en esta semana.</strong>Registra trabajo en Producción para liquidar destajo a los operarios asignados.</section>`}</div>`;}
function traceTable(l){const s=l.stocks;return `<div class="detail-grid"><div class="lot-measure"><b>${fmt(l.planned)}</b><span>Planificadas</span></div><div class="lot-measure"><b>${fmt(s.finished)}</b><span>Terminadas</span></div><div class="lot-measure"><b>${fmt(s.transit)}</b><span>En tránsito</span></div><div class="lot-measure"><b>${fmt(s.held+s.incidents)}</b><span>Novedades</span></div></div><div class="table-wrap"><table class="data-table"><thead><tr><th>Ubicación</th><th>Pendiente</th><th>Lista</th><th>Total</th></tr></thead><tbody>${STAGES.map(a=>`<tr><td class="maincol">${LABELS[a]}</td><td>${fmt(s[a].pending)}</td><td>${fmt(s[a].ready)}</td><td><b>${fmt(s[a].pending+s[a].ready)}</b></td></tr>`).join('')}${[['En tránsito',s.transit],['Retenidas',s.held],['Diferencias por conciliar',s.incidents],['Producto terminado',s.finished],['Merma definitiva',s.scrap]].map(([k,v])=>`<tr><td class="maincol">${k}</td><td>—</td><td>—</td><td><b>${fmt(v)}</b></td></tr>`).join('')}</tbody></table></div><div class="audit-balance ${sumStock(l)!==l.planned?'error':''}"><span><b>Control de conciliación</b><br><small>${fmt(sumStock(l))} unidades localizadas o clasificadas / ${fmt(l.planned)} planificadas</small></span>${tag(sumStock(l)===l.planned?'Sin descuadre':'Descuadre',''+(sumStock(l)===l.planned?'green':'red'))}</div>`;}
